name: Generate SVGs

on:
  push:
    branches:
      - main
    paths:
      - 'src/data/icons/**/*.ts'
      - 'src/data/wimojiIcons.ts'
      - 'src/data/constants.ts'
      - 'src/utils/skinTones.ts'
      - 'src/utils/svgGenerator.ts'
      - 'src/types/wimoji.ts'
      - 'scripts/generateSvgs.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-svgs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Unicode 18.0.0 emoji sequences
        run: |
          mkdir -p .unicode-sequences
          curl --fail --location --retry 3 \
            https://unicode.org/Public/18.0.0/emoji/emoji-sequences.txt \
            --output .unicode-sequences/emoji-sequences.txt
          curl --fail --location --retry 3 \
            https://unicode.org/Public/18.0.0/emoji/emoji-zwj-sequences.txt \
            --output .unicode-sequences/emoji-zwj-sequences.txt

      - name: Generate SVGs
        run: bun run generate:svgs

      - name: Commit and push generated SVGs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f color/svg/
          if git diff --cached --quiet; then
            echo "No generated SVG changes to commit"
            exit 0
          fi
          git commit -m "Generate SVGs"
          git push origin HEAD:main
