name: Generate SVGs

on:
  push:
    paths:
      - 'src/data/icons/**/*.ts'
      - 'src/data/wimojiIcons.ts'
      - 'src/data/constants.ts'
      - 'src/utils/skinTones.ts'
      - 'src/utils/svgGenerator.ts'
      - 'src/types/wimoji.ts'
      - 'scripts/generateSvgs.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-svgs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SVGs
        run: bun run generate:svgs

      - name: Download Unicode 18.0.0 emoji sequences
        run: 
          mkdir -p generated-svgs/unicode
          curl --fail --location --retry 3 \
            https://unicode.org/Public/18.0.0/emoji/emoji-sequences.txt \
            --output generated-svgs/unicode/emoji-sequences.txt
          curl --fail --location --retry 3 \
            https://unicode.org/Public/18.0.0/emoji/emoji-zwj-sequences.txt \
            --output generated-svgs/unicode/emoji-zwj-sequences.txt

      - name: Upload SVGs
        uses: actions/upload-artifact@v4
        with:
          name: wimoji-svgs
          path: generated-svgs/
          if-no-files-found: error
          retention-days: 30
