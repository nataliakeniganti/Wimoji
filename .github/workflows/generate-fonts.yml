name: Generate Fonts

on:
  workflow_run:
    workflows:
      - Generate PNGs
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-fonts-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-fonts.txt

      - name: Install Nanoemoji
        run: python -m pip install --disable-pip-version-check --no-compile -r requirements-fonts.txt

      - name: Prepare SVG sources
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/wimoji-fonts"
          python scripts/prepareFontSvgs.py outline/svg "$work_dir/outline"
          python scripts/prepareFontSvgs.py color/svg "$work_dir/color"

          outline_count=$(find "$work_dir/outline" -maxdepth 1 -type f -name '*.svg' | wc -l)
          color_count=$(find "$work_dir/color" -maxdepth 1 -type f -name '*.svg' | wc -l)
          raw_color_count=$(find color/svg -maxdepth 1 -type f -name '*.svg' | wc -l)
          if [[ "$outline_count" -eq 0 || "$color_count" -eq 0 ]]; then
            echo "SVG normalization produced no usable inputs" >&2
            exit 1
          fi
          if [[ "$raw_color_count" -eq 0 ]]; then
            echo "Color SVG inputs are required" >&2
            exit 1
          fi

          {
            echo "FONT_WORK_DIR=$work_dir"
            echo "FONT_OUTLINE_COUNT=$outline_count"
            echo "FONT_COLOR_COUNT=$color_count"
            echo "FONT_RAW_COLOR_COUNT=$raw_color_count"
          } >> "$GITHUB_ENV"

      - name: Build fonts
        run: bash scripts/generateFonts.sh

      - name: Commit and push generated fonts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f font/
          if git diff --cached --quiet; then
            echo "No generated font changes to commit"
            exit 0
          fi
          git commit -m "Generate emoji fonts"
          git push origin HEAD:main