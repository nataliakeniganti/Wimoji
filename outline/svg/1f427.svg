        <!-- Eyes and beak -->
        <circle cx="13.4" cy="11.4" r="1" fill="#000000" />
        <circle cx="18.6" cy="11.4" r="1" fill="#000000" />
        <circle cx="13.7" cy="11" r="0.3" fill="none" stroke="none" />
        <circle cx="18.9" cy="11" r="0.3" fill="none" stroke="none" />
        <path d="M14 13.2 H18 L16 16 Z" fill="none" stroke="#000000" stroke-width="0.7" />
      </g>
