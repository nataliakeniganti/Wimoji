<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="penguin">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Feet -->
        <ellipse cx="12.4" cy="27.6" rx="3.2" ry="1.3" fill="none" stroke="#000000" stroke-width="0.8" />
        <ellipse cx="19.6" cy="27.6" rx="3.2" ry="1.3" fill="none" stroke="#000000" stroke-width="0.8" />
        <!-- Flippers -->
        <ellipse cx="7.2" cy="17.6" rx="2.1" ry="5.8" transform="rotate(14 7.2 17.6)" fill="none" stroke="#000000" stroke-width="1.5" />
        <ellipse cx="24.8" cy="17.6" rx="2.1" ry="5.8" transform="rotate(-14 24.8 17.6)" fill="none" stroke="#000000" stroke-width="1.5" />
        <!-- Body -->
        <ellipse cx="16" cy="16.6" rx="8.4" ry="10.4" fill="none" stroke="#000000" stroke-width="1.5" />
