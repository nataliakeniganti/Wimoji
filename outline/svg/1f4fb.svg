<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="radio">
<g stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <!-- Antenna -->
          <line x1="6" y1="11" x2="26" y2="2.5" />
          <circle cx="26" cy="2.5" r="1" fill="#000000" />
          <!-- Radio Body -->
          <rect x="3" y="11" width="26" height="17" rx="3" />
          <!-- Left Speaker Grille -->
          <circle cx="11" cy="19.5" r="5" />
          <circle cx="11" cy="19.5" r="2" />
          <!-- Tuning Dial Window -->
          <rect x="18" y="14" width="8" height="4" rx="1" />
          <line x1="22" y1="14" x2="22" y2="18" />
          <!-- Knobs -->
          <circle cx="20" cy="23.5" r="1.8" />
          <circle cx="24.5" cy="23.5" r="1.8" />
        </g>
</svg>