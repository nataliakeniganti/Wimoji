<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="nut-and-bolt">
<g transform="rotate(-45 16 16)" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Threaded shank -->
        <rect x="12.8" y="7" width="6.4" height="21" rx="1" fill="none" />
        <!-- Thread grooves -->
        <g stroke-width="1.4" fill="none">
          <line x1="12.8" y1="20" x2="19.2" y2="20" />
          <line x1="12.8" y1="23" x2="19.2" y2="23" />
          <line x1="12.8" y1="26" x2="19.2" y2="26" />
        </g>
        <!-- Hex head (side view) -->
        <rect x="9.5" y="2.5" width="13" height="5.5" rx="1.5" fill="none" />
        <!-- Hex nut (side view) -->
        <rect x="10" y="11" width="12" height="6" rx="1.5" fill="none" />
        <line x1="14" y1="11" x2="14" y2="17" stroke-width="1.4" />
        <line x1="18" y1="11" x2="18" y2="17" stroke-width="1.4" />
      </g>
</svg>