<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="airplane-departure">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Airport ground: asphalt runway with centreline and edge marks -->
        <rect x="2" y="23" width="28" height="7" rx="1.8" fill="none" stroke="#000000" stroke-width="1.6" />
        <line x1="5" y1="26.5" x2="27" y2="26.5" stroke="#000000" stroke-width="1.2" stroke-dasharray="3 2.6" />
        
        <!-- Jet climbing away from the runway (nose up-right) -->
        <g transform="translate(16 12.5) rotate(62) scale(0.66) translate(-16 -16)">
          <!-- Rear engine pods -->
          <rect x="7.6" y="15.8" width="2.8" height="4.4" rx="1.2" fill="none" stroke="#000000" stroke-width="1.4545454545454546" />
          <rect x="21.6" y="15.8" width="2.8" height="4.4" rx="1.2" fill="none" stroke="#000000" stroke-width="1.4545454545454546" />
          <!-- Fuselage and swept wings -->
          <path d="M16 2.5c-1.5 0-2.5 2-2.5 5.5v7l-10.5 4v2.5l10.5-2.5v5.5l-3 2v1.5l5.5-1 5.5 1V27l-3-2V19l10.5 2.5v-2.5l-10.5-4V8c0-3.5-1-5.5-2.5-5.5z" fill="none" stroke="#000000" stroke-width="2.4242424242424243" />
          <!-- Cockpit windshield -->
          <ellipse cx="16" cy="6.2" rx="1.8" ry="1.3" fill="none" stroke="#000000" stroke-width="1.4545454545454546" />
        </g>
      </g>
</svg>