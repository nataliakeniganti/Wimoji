<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="rabbit-animal">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Cotton tail -->
        <circle cx="25.2" cy="21.5" r="2.6" fill="none" stroke="#000000" stroke-width="1.5" />
        <!-- Body -->
        <ellipse cx="16.5" cy="21" rx="8.3" ry="5.8" fill="none" stroke="#000000" stroke-width="1.5" />
        <!-- Haunch -->
        <path d="M14 26 C13 21 18 18.5 22 21.5" fill="none" stroke="#000000" stroke-width="1.5" />
        <ellipse cx="19.5" cy="25.8" rx="3.6" ry="1.2" fill="none" stroke="#000000" stroke-width="1.5" />
        <!-- Far ear, near ear -->
        <ellipse cx="12.6" cy="8" rx="1.7" ry="5.2" transform="rotate(14 12.6 8)" fill="none" stroke="#000000" stroke-width="1.5" />
        <ellipse cx="9.4" cy="7.6" rx="1.8" ry="5.4" transform="rotate(-6 9.4 7.6)" fill="none" stroke="#000000" stroke-width="1.5" />
        <ellipse cx="9.4" cy="7.8" rx="0.8" ry="3.8" transform="rotate(-6 9.4 7.8)" fill="none" />
        <!-- Head -->
        <circle cx="8.6" cy="16" r="4.2" fill="none" stroke="#000000" stroke-width="1.5" />
        <circle cx="6.9" cy="15.1" r="0.9" fill="#000000" />
        <circle cx="4.6" cy="17.1" r="0.9" fill="none" />
        <path d="M4.8 18 L2.4 18.6 M5 16.8 L2.6 16.2" fill="none" stroke="#000000" stroke-width="0.6" />
        <!-- Front paw -->
        <ellipse cx="9.2" cy="26.2" rx="2.8" ry="1.2" fill="none" stroke="#000000" stroke-width="1.5" />
      </g>
