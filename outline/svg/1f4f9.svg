<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="video-camera">
<g stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <!-- Camera main body -->
          <rect x="4" y="10" width="16" height="13" rx="2.5" />
          <!-- Viewfinder eyepiece at top -->
          <rect x="7" y="6" width="7" height="4" rx="1" />
          <!-- Forward zoom lens on right -->
          <path d="M20 13 L27 8 V25 L20 20 Z" />
          <!-- Record LED -->
          <circle cx="16" cy="13" r="1" />
          <!-- Side cassette tape door / screen lines -->
          <line x1="7" y1="17" x2="13" y2="17" />
        </g>
</svg>