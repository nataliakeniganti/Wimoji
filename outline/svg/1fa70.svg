<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="ballet-shoes">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- LEFT: slipper seen from above, toe pointing down -->
        <g transform="rotate(-7 9 16) translate(8.8 0) scale(1.2 1) translate(-8.8 0)">
        <path d="M6 5.4 C6 3.6 7.4 2.8 9 2.8 C10.6 2.8 12 3.6 12 5.4 C12.6 10.4 14.6 16 14.8 21 C15 25.8 12.6 29.2 8.8 29.2 C4.8 29.2 2.4 25.8 2.8 21.4 C3.4 16 5.4 10.4 6 5.4 Z" fill="none" stroke="#000000" stroke-width="1.1" />
        <!-- Cream lining of the opening -->
        <path d="M7.2 6 C7.2 5 8 4.6 9 4.6 C10 4.6 10.8 5 10.8 6 C11.4 10.6 12.8 15.6 12.9 20.6 C13 24 11.4 26.4 8.8 26.4 C6.2 26.4 4.6 24 4.9 20.8 C5.4 15.8 6.6 10.6 7.2 6 Z" fill="none" stroke="#000000" stroke-width="0.77" />
        <!-- Criss-cross elastic straps -->
        <g fill="none" stroke-linecap="butt">
          <path d="M5.2 12.6 L13 19.2" stroke="#000000" stroke-width="3.5200000000000005" />
          <path d="M12.6 12.6 L4.8 19.2" stroke="#000000" stroke-width="3.5200000000000005" />
          <path d="M5.2 12.6 L13 19.2" stroke="none" stroke-width="2.2" />
          <path d="M12.6 12.6 L4.8 19.2" stroke="none" stroke-width="2.2" />
        </g>
        <!-- Toe bow -->
        <g transform="translate(8.8 24.4) scale(1.3) translate(-8.8 -24.4)"><path d="M8.8 24 C7 22.8 6 23.8 6.2 25 C6.4 26.2 7.8 25.8 8.8 24.8 Z M8.8 24 C10.6 22.8 11.6 23.8 11.4 25 C11.2 26.2 9.8 25.8 8.8 24.8 Z" fill="none" stroke="#000000" stroke-width="0.8800000000000001" />
        <circle cx="8.8" cy="24.4" r="0.7" fill="none" stroke="none" /></g>
        </g>

        <!-- RIGHT: pointe shoe in side/bottom profile, toe at the bottom -->
        <!-- Upper (peach satin) -->
        <path d="M19.4 4.4 C17.6 8.6 17.4 14 18.6 18.8 C19.4 22.2 19.2 25.4 20.8 27.8 C22.2 30 26 30.2 27.4 27.6 C28.2 25.2 25.4 22.2 25.4 18.6 C25.4 14.2 29.4 11.2 29.4 7.4 C29.4 4.2 26.6 2.6 23.8 2.6 C21.8 2.6 20 3.2 19.4 4.4 Z" fill="none" stroke="#000000" stroke-width="1.1" />
        <!-- Heel throat showing the cream lining -->
        <path d="M20 4.8 C21.2 3.4 24.4 3.2 26.2 4.6 C25 6.2 22.2 6.8 20 6 Z" fill="none" stroke="#000000" stroke-width="0.66" />
        <!-- Gathered pleats around the toe tip -->
        <ellipse cx="23.6" cy="27" rx="3.4" ry="2.8" fill="none" opacity="1" stroke="#000000" stroke-width="0.77" />
        <path d="M23.6 29.6 L20.8 25.2 M23.6 29.6 L22.4 24.4 M23.6 29.6 L24.8 24.4 M23.6 29.6 L26.4 25.2" fill="none" stroke="#000000" stroke-width="0.77" opacity="0.8" />
        <path d="M19.4 21.4 C21 23 26 23.2 27 21.6" fill="none" stroke="#000000" stroke-width="0.77" opacity="0.6" />
        <!-- Satin sheen -->
        <path d="M19.6 8.6 C19 12.4 19.2 16.2 20 19.4" fill="none" stroke="none" stroke-width="1.32" opacity="0.45" />
        <!-- Off-white leather outer sole with arched shank -->
        <path d="M26.5 6.4 C26.7 10.8 23.3 13.8 23.3 18 C23.3 21.4 25.5 23.6 24.9 26.6 M29.5 6.4 C29.7 10.8 26.3 13.8 26.3 18 C26.3 21.4 28.5 23.6 27.9 26.6" fill="none" stroke="#000000" stroke-width="1.1" />
      </g>
</svg>