          <rect x="14.2" y="1.6" width="3.6" height="3.8" rx="1" fill="none" />
          <path d="M13.8 9 H18.2" fill="none" stroke="#000000" stroke-width="0.9799999999999999" />
        </g>
        <!-- Focus knob -->
        <circle cx="24.6" cy="17.6" r="2.1" fill="none" stroke="#000000" stroke-width="1.4" />
        <circle cx="24.6" cy="17.6" r="0.6" fill="#000000" stroke="none" />
      </g>
