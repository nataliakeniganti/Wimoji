        <path d="M11 19.6 H17" stroke="#000000" stroke-width="1.3" fill="none" />
        <!-- Illumination mirror -->
        <ellipse cx="11" cy="24.4" rx="2.6" ry="1.1" fill="none" stroke="#000000" stroke-width="1.1199999999999999" />
        <!-- Angled body tube, objective and eyepiece -->
