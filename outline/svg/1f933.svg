<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="selfie">
<g stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Reaching forearm from bottom corner -->
        <path d="M0 32 C3 25.5 6 22 10.5 19.5 L14 24 C10 26.5 5 29.5 2 32 Z" fill="none" />
        <!-- Smartphone body -->
        <rect x="8.5" y="4" width="15" height="23" rx="2.5" fill="none" />
        <!-- Screen display -->
        <rect x="10" y="6" width="12" height="17" rx="1.2" fill="none" stroke-width="1.2" />
        <!-- Front camera pinhole / speaker notch -->
        <circle cx="16" cy="5" r="0.6" fill="#000000" stroke="none" />
        <!-- Selfie camera viewfinder portrait outline on screen -->
        <circle cx="16" cy="11.5" r="2.2" fill="none" stroke="#000000" stroke-width="1" />
        <path d="M12.8 18 C13.2 15.6 18.8 15.6 19.2 18" fill="none" stroke="#000000" stroke-width="1" />
        <!-- Flash sparkle at top right corner -->
        <path d="M21 2 L22 3.6 L23.6 4.6 L22 5.6 L21 7.2 L20 5.6 L18.4 4.6 L20 3.6 Z" fill="none" stroke-width="0.9" />
        <!-- Thumb gripping right side of phone -->
        <path d="M22.5 18 C25 18 26.2 19 26.2 20.6 C26.2 22.2 24.5 22.8 22.5 22" fill="none" />
        <!-- Curled fingers gripping left side of phone -->
        <path d="M6.5 9 C6.5 7.8 9.5 7.8 10.2 9.2 V10.8 C9 11.2 6.5 10.5 6.5 9 Z" fill="none" stroke-width="1.5" />
        <path d="M6.5 12.2 C6.5 11 9.5 11 10.2 12.4 V14 C9 14.4 6.5 13.7 6.5 12.2 Z" fill="none" stroke-width="1.5" />
        <path d="M6.5 15.4 C6.5 14.2 9.5 14.2 10.2 15.6 V17.2 C9 17.6 6.5 16.9 6.5 15.4 Z" fill="none" stroke-width="1.5" />
        <path d="M7 18.6 C7 17.4 9.8 17.4 10.4 18.8 V20.4 C9 20.8 7 20.1 7 18.6 Z" fill="none" stroke-width="1.5" />
      </g>
</svg>