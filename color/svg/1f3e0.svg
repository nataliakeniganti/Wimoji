<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="house">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Chimney -->
        <rect x="21" y="6" width="3" height="6" fill="#78350F" />
        <!-- Red Gabled Roof -->
        <polygon points="16,4 3,14.5 29,14.5" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
        <!-- House Wall Body -->
        <rect x="6" y="14.5" width="20" height="12.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
        <!-- Front Windows -->
        <rect x="8" y="16.5" width="3.5" height="3.5" rx="0.5" fill="#38BDF8" />
        <rect x="20.5" y="16.5" width="3.5" height="3.5" rx="0.5" fill="#38BDF8" />
        <!-- Wooden Door with Knob -->
        <rect x="13" y="19.5" width="6" height="7.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.8" />
        <circle cx="17.5" cy="23.5" r="0.6" fill="#78350F" />
      </g>
</svg>