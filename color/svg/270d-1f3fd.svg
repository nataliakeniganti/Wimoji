<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="writing-hand-medium">
<g>
        <!-- Drawn ink curve / baseline -->
        <path d="M3.5 27.5c2 0 3-1 5 1" stroke="#90A4AE" stroke-width="1.8" stroke-linecap="round" fill="none" />

        <!-- Pen upper barrel (Vibrant Stylus / Pen) -->
        <path d="M12 16.5L23.5 5a1.8 1.8 0 0 1 2.5 0l.5.5a1.8 1.8 0 0 1 0 2.5L15 19.5z" fill="#1E88E5" stroke="#1565C0" stroke-width="0.8" />
        <!-- Pen barrel clip / shine -->
        <path d="M22 6.5l3 3" stroke="#90CAF9" stroke-width="1.2" stroke-linecap="round" />

        <!-- Hand body silhouette (Noto Yellow) -->
        <path d="M28 16c-3-2-7.5-3-11.5-1.5-2.2.8-4.5 2.2-6.5 4.5l-1.5 2c-.6 1-.2 2.2.8 2.8.8.5 2 .2 2.7-.5l1.5-1.5 1 2.5c.5 1 1.6 1.6 2.8 1.4 1-.2 1.8-1 2-2l.5 1.5c.5 1 1.5 1.7 2.7 1.5 1.2-.2 2-1.2 2-2.4l1.2.8c1 .7 2.4.4 3-.6.6-1 .4-2.4-.4-3.2l.9-1c1-1.2 1.2-2.8.6-4.4z" fill="#D5A070" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Pen lower metal collar &amp; nib -->
        <polygon points="12,16.5 5,23.5 4,27 7.5,26 14.5,19" fill="#ECEFF1" stroke="#5D4037" stroke-width="1" />
        <polygon points="5,23.5 4,27 6.5,26.2" fill="#263238" />

        <!-- Thumb curled grasping pen -->
        <path d="M16 19.5c-1.5-.8-3-.8-4.5-1.2-.8-.2-1.5.3-1.5 1.1s.5 1.4 1.2 1.7c1.5.6 3 1.1 4.8.6z" fill="#D5A070" stroke="#5D4037" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Natural finger creases (warm brown) -->
        <path d="M10.5 21.2c.8.8 1.8 1.2 2.8 1.1" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round" fill="none" />
        <path d="M13.5 23.8c.8.6 1.8.8 2.8.5" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round" fill="none" />
        <path d="M16.5 25.5c.8.5 1.8.6 2.6.3" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round" fill="none" />
      </g>
</svg>