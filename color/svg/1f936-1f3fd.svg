<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="mrs-claus-medium">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Red holiday gown shoulders -->
        <path d="M8 32 C8 26 11.5 24 16 24 C20.5 24 24 26 24 32 Z" fill="#EF4444" stroke="#DC2626" stroke-width="0.8" />
        <path d="M13.8 24 L16 27 L18.2 24 Z" fill="#FFFFFF" />
        <!-- Grey hair bun peeking at top behind hat -->
        <circle cx="16" cy="4.8" r="2.8" fill="#CBD5E1" />
        <!-- Red Santa Hat -->
        <path d="M8 10 C9 4 13 2 17 2 C21 2 26 4 26 8 L25 10 H8 Z" fill="#EF4444" stroke="#DC2626" stroke-width="0.8" />
        <!-- Hat Fluffy White Trim -->
        <rect x="7" y="9" width="18" height="3" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.6" />
        <!-- Pompom Ball -->
        <circle cx="26" cy="11" r="2.2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.6" />
        <!-- Cheerful Grandmother Face -->
        <ellipse cx="16" cy="16.5" rx="6.5" ry="6.2" fill="#D5A070" stroke="#B37D4D" stroke-width="0.8" />
        <!-- Soft grey curls framing cheeks -->
        <path d="M9.8 11.2 C9 15 9.5 19 11.2 21 M22.2 11.2 C23 15 22.5 19 20.8 21" fill="none" stroke="#CBD5E1" stroke-width="2" />
        <!-- Rosy Cheeks -->
        <circle cx="11.5" cy="17.8" r="1.4" fill="#F472B6" opacity="0.65" />
        <circle cx="20.5" cy="17.8" r="1.4" fill="#F472B6" opacity="0.65" />
        <!-- Round wireframe spectacles -->
        <circle cx="13" cy="15.8" r="1.8" fill="none" stroke="#475569" stroke-width="0.75" />
        <circle cx="19" cy="15.8" r="1.8" fill="none" stroke="#475569" stroke-width="0.75" />
        <line x1="14.8" y1="15.8" x2="17.2" y2="15.8" stroke="#475569" stroke-width="0.75" />
        <!-- Friendly smiling eyes inside glasses -->
        <circle cx="13" cy="15.8" r="0.75" fill="#37474F" />
        <circle cx="19" cy="15.8" r="0.75" fill="#37474F" />
        <!-- Sweet grandmotherly smile -->
        <path d="M13.6 20 C14.6 21.2 17.4 21.2 18.4 20" fill="none" stroke="#E11D48" stroke-width="1.3" />
      </g>
</svg>