<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="oncoming-bus">
<g>
        <!-- Bus Tires Underneath -->
        <rect x="7" y="22" width="3.5" height="5" rx="1" fill="#0F172A" />
        <rect x="21.5" y="22" width="3.5" height="5" rx="1" fill="#0F172A" />
        <!-- Bus Front Chassis (Blue) -->
        <rect x="5.5" y="5" width="21" height="19" rx="4" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.2" />
        <!-- Panoramic Windshield -->
        <rect x="8" y="8" width="16" height="8" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" />
        <!-- Side mirrors -->
        <rect x="3.5" y="10" width="2" height="4" rx="0.5" fill="#3B82F6" />
        <rect x="26.5" y="10" width="2" height="4" rx="0.5" fill="#3B82F6" />
        <!-- Bright Headlights -->
        <circle cx="10" cy="19.5" r="1.8" fill="#FBBF24" stroke="#D97706" stroke-width="0.6" />
        <circle cx="22" cy="19.5" r="1.8" fill="#FBBF24" stroke="#D97706" stroke-width="0.6" />
        <!-- License Plate -->
        <rect x="13.5" y="20.5" width="5" height="2" rx="0.5" fill="#FFFFFF" />
      </g>
</svg>