<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="videocassette">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Black VHS cassette plastic shell -->
        <rect x="3" y="7" width="26" height="18" rx="2.5" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
        <!-- White paper label with red/blue line -->
        <rect x="6" y="9.5" width="20" height="4.5" rx="1" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4" />
        <line x1="8" y1="11.5" x2="24" y2="11.5" stroke="#EF4444" stroke-width="1" />
        <!-- Clear viewing window spanning the reels -->
        <rect x="6.5" y="15" width="19" height="7" rx="1.5" fill="#334155" stroke="#0F172A" stroke-width="1.4" />
        <!-- Left white magnetic tape spool -->
        <circle cx="10" cy="18.5" r="3.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4" />
        <circle cx="10" cy="18.5" r="1.2" fill="#1E293B" />
        <!-- Right white magnetic tape spool -->
        <circle cx="22" cy="18.5" r="3.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4" />
        <circle cx="22" cy="18.5" r="1.2" fill="#1E293B" />
      </g>
</svg>