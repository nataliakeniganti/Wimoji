<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="snow-capped-mountain">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Mountain Shadow Side (East) -->
        <polygon points="16,5 16,28 30,28" fill="#475569" stroke="#1E293B" stroke-width="1" />
        <!-- Mountain Sunlight Side (West) -->
        <polygon points="16,5 2,28 16,28" fill="#64748B" stroke="#1E293B" stroke-width="1" />
        <!-- Central Ridge Line -->
        <line x1="16" y1="5" x2="16" y2="28" stroke="#334155" stroke-width="1.2" />
        <!-- Snow Cap Glacier -->
        <polygon points="16,5 11,14 13.5,15.5 15,13.5 16.5,15 18,13 21,17 23,14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
      </g>
</svg>