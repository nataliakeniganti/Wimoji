<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="smiling-face-with-horns">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Horns behind head -->
        <polygon points="8,12 5,4.5 11.5,8" fill="#9333EA" stroke="#7E22CE" stroke-width="0.8" />
        <polygon points="24,12 27,4.5 20.5,8" fill="#9333EA" stroke="#7E22CE" stroke-width="0.8" />
        <!-- Purple Face Base with inner highlight -->
        <circle cx="16" cy="17" r="11.5" fill="#9333EA" stroke="#7E22CE" stroke-width="0.8" />
        <circle cx="16" cy="16" r="10" fill="#C084FC" opacity="0.25" />
        <!-- Angry/devious furrowed eyebrows -->
        <line x1="8.5" y1="11.5" x2="14" y2="14" stroke="#1E1B4B" stroke-width="2.2" />
        <line x1="23.5" y1="11.5" x2="18" y2="14" stroke="#1E1B4B" stroke-width="2.2" />
        <!-- Expressive eyes with glints -->
        <ellipse cx="11.5" cy="15" rx="1.6" ry="2.2" fill="#1E1B4B" />
        <ellipse cx="20.5" cy="15" rx="1.6" ry="2.2" fill="#1E1B4B" />
        <circle cx="12" cy="14.2" r="0.6" fill="#FFFFFF" opacity="0.9" />
        <circle cx="21" cy="14.2" r="0.6" fill="#FFFFFF" opacity="0.9" />
        <!-- Mischievous upturned devil grin -->
        <path d="M10.5 20.5 C12.5 24.5 19.5 24.5 21.5 20.5" stroke="#1E1B4B" stroke-width="2.2" fill="none" />
      </g>
</svg>