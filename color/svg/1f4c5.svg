        <line x1="9" y1="3" x2="9" y2="7" stroke="#991B1B" stroke-width="2.5" />
        <line x1="23" y1="3" x2="23" y2="7" stroke="#991B1B" stroke-width="2.5" />
        <!-- Date grid marks -->
        <circle cx="9" cy="16.5" r="1.5" fill="#991B1B" />
        <circle cx="16" cy="16.5" r="1.5" fill="#991B1B" />
        <circle cx="23" cy="16.5" r="1.5" fill="#991B1B" />
        <circle cx="9" cy="22.5" r="1.5" fill="#991B1B" />
        <circle cx="16" cy="22.5" r="1.5" fill="#EF4444" />
        <circle cx="23" cy="22.5" r="1.5" fill="#991B1B" />
      </g>
</svg>