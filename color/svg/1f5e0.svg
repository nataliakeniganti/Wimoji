<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="stock-chart">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Display Monitor / Board Panel -->
        <rect x="3" y="4" width="26" height="24" rx="3" fill="#1E293B" stroke="#0F172A" stroke-width="1.2" />
        <!-- Background Volume Bars -->
        <rect x="7" y="18" width="3" height="5" rx="0.5" fill="#334155" opacity="0.6" />
        <rect x="12" y="15" width="3" height="8" rx="0.5" fill="#334155" opacity="0.6" />
        <rect x="17" y="17" width="3" height="6" rx="0.5" fill="#334155" opacity="0.6" />
        <rect x="22" y="10" width="3" height="13" rx="0.5" fill="#334155" opacity="0.6" />
        <!-- Axis Line -->
        <line x1="6" y1="23" x2="26" y2="23" stroke="#64748B" stroke-width="0.8" />
        <!-- Ascending Trendline -->
        <polyline points="7,20 12.5,15 17.5,18 24,9" fill="none" stroke="#10B981" stroke-width="2.2" />
        <!-- High Peak Dot -->
        <circle cx="24" cy="9" r="2" fill="#10B981" />
      </g>
</svg>