<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="slot-machine">
<g>
        <!-- Lever Arm on Right -->
        <line x1="23" y1="18" x2="28" y2="11" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <circle cx="28" cy="10.5" r="2.5" fill="#EF4444" stroke="#991B1B" stroke-width="0.8" />
        <!-- Slot Cabinet Housing -->
        <rect x="4" y="6" width="20" height="22" rx="3" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
        <!-- Top Crown Sign (777 Jackpots) -->
        <rect x="6" y="8" width="16" height="3" rx="1" fill="#FBBF24" />
        <!-- Display Reels Window -->
        <rect x="6.5" y="12" width="15" height="8.5" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" />
        <line x1="11.5" y1="12" x2="11.5" y2="20.5" stroke="#CBD5E1" stroke-width="1" />
        <line x1="16.5" y1="12" x2="16.5" y2="20.5" stroke="#CBD5E1" stroke-width="1" />
        <!-- 7 7 7 Digits on Reels -->
        <g fill="#DC2626" stroke="none" transform="translate(7.284 18.5) scale(0.006 -0.006)"><path d="M111 0 379 587H27V714H539V619L269 0Z" transform="translate(0 0)" /></g>
        <g fill="#DC2626" stroke="none" transform="translate(12.284 18.5) scale(0.006 -0.006)"><path d="M111 0 379 587H27V714H539V619L269 0Z" transform="translate(0 0)" /></g>
        <g fill="#DC2626" stroke="none" transform="translate(17.284 18.5) scale(0.006 -0.006)"><path d="M111 0 379 587H27V714H539V619L269 0Z" transform="translate(0 0)" /></g>
        <!-- Coin Payout Tray -->
        <rect x="8" y="23" width="12" height="3" rx="1" fill="#0F172A" />
      </g>
</svg>