<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="sparkler">
<g>
        <!-- Wire Handle extending from bottom-left -->
        <line x1="5" y1="27" x2="16" y2="16" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" />
        <!-- Incandescent Spark Core -->
        <circle cx="16" cy="16" r="2.5" fill="#FFFFFF" />
        <circle cx="16" cy="16" r="4" fill="#FBBF24" opacity="0.4" />
        <!-- Shooting Golden Spark Rays -->
        <line x1="16" y1="5" x2="16" y2="11" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
        <line x1="27" y1="16" x2="21" y2="16" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
        <line x1="24" y1="8" x2="19" y2="13" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
        <line x1="25" y1="23" x2="20" y2="19" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
        <line x1="11" y1="6" x2="14" y2="12" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
        <!-- Glowing Spark Points -->
        <circle cx="16" cy="4" r="1" fill="#FEF08A" />
        <circle cx="28" cy="16" r="1" fill="#FEF08A" />
        <circle cx="25" cy="7" r="1" fill="#FEF08A" />
        <circle cx="26" cy="24" r="1" fill="#FEF08A" />
      </g>
</svg>