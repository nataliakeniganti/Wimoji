<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="bouquet-of-flowers">
<g>
        <!-- Stems tied at center -->
        <line x1="16" y1="17" x2="12" y2="29" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="17" x2="16" y2="29" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="17" x2="20" y2="29" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />
        <rect x="13.5" y="19" width="5" height="3" rx="1" fill="#F43F5E" />
        <!-- Left Flower (Yellow) -->
        <circle cx="10" cy="14" r="4.2" fill="#F59E0B" stroke="#D97706" stroke-width="0.8" />
        <circle cx="10" cy="14" r="1.5" fill="#FEF08A" />
        <!-- Right Flower (Purple/Cyan) -->
        <circle cx="22" cy="14" r="4.2" fill="#A855F7" stroke="#7E22CE" stroke-width="0.8" />
