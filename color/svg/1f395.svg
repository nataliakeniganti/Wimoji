        <!-- Center Big Pink Rose / Flower -->
        <circle cx="16" cy="10" r="5" fill="#EC4899" stroke="#9D174D" stroke-width="1" />
        <circle cx="16" cy="10" r="2" fill="#FBCFE8" />
