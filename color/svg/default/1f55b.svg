<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="twelve-o-clock">
<g stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock outer bezel case -->
    <circle cx="16" cy="16" r="13" fill="#3B82F6" stroke="#1E293B" stroke-width="1.4" />
    <path d="M7.5 10.5 C10 6.5 13.5 5 16 5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.65" />
    <!-- Clock dial face -->
    <circle cx="16" cy="16" r="10.4" fill="#FFFFFF" stroke="none" stroke-width="0.9799999999999999" />
    <!-- 12, 3, 6, 9 hour marks -->
    <g fill="#94A3B8" stroke="none">
      <circle cx="16" cy="7.2" r="0.75" />
      <circle cx="24.8" cy="16" r="0.75" />
      <circle cx="16" cy="24.8" r="0.75" />
      <circle cx="7.2" cy="16" r="0.75" />
    </g>
    <!-- Hour hand -->
    <line x1="16" y1="16" x2="16" y2="11" stroke="#1E293B" stroke-width="2.1" />
    <!-- Minute hand -->
    <line x1="16" y1="16" x2="16" y2="7.8" stroke="#1E293B" stroke-width="1.4" />
    <!-- Center pivot pin -->
    <circle cx="16" cy="16" r="1.3" fill="#EF4444" stroke="#1E293B" stroke-width="0.84" />
  </g>
</svg>