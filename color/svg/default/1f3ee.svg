<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="red-paper-lantern">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Hanging Wire Loop -->
        <line x1="16" y1="2" x2="16" y2="5.5" stroke="#1E293B" stroke-width="1.5" />
        <!-- Red Paper Oval Lantern Body -->
        <ellipse cx="16" cy="16" rx="9.5" ry="10.5" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
        <!-- Golden Top &amp; Bottom Caps -->
        <rect x="11" y="5" width="10" height="2.5" rx="0.5" fill="#1E293B" stroke="#0F172A" stroke-width="0.8" />
        <rect x="11" y="24.5" width="10" height="2.5" rx="0.5" fill="#1E293B" stroke="#0F172A" stroke-width="0.8" />
        <!-- Bottom Gold Tassel -->
        <line x1="16" y1="27" x2="16" y2="31" stroke="#FBBF24" stroke-width="2.5" />
        <!-- Paper Rib Lines -->
        <path d="M7.2 13h17.6M6.8 16h18.4M7.2 19h17.6" stroke="#991B1B" stroke-width="1" />
      </g>
</svg>