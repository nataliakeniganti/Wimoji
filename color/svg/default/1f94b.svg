        <rect x="10.5" y="17.8" width="11" height="2.8" rx="0.6" fill="#0F172A" stroke="#0F172A" stroke-width="0.8" />
        <!-- Center Belt Knot -->
        <circle cx="16" cy="19.2" r="1.5" fill="#0F172A" stroke="#0F172A" stroke-width="0.6" />
        <!-- Hanging Belt Ribbon Ends -->
        <path d="M15 20.5 L14 27" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />
        <path d="M17 20.5 L18.2 27.5" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />
      </g>
