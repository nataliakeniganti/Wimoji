        <rect x="11.5" y="23" width="3" height="3" rx="0.5" fill="#78350F" />
        <!-- Pyramid of Tsukimi Dango Dumplings -->
        <circle cx="10" cy="19" r="2.2" fill="#FFFFFF" />
        <circle cx="16" cy="19" r="2.2" fill="#FFFFFF" />
        <circle cx="13" cy="15.5" r="2.2" fill="#FFFFFF" />
      </g>
