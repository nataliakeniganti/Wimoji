        <g transform="rotate(-45 16 16)" fill="none" stroke-width="2">
          <path d="M 13.5 11.6 L 7.5 11.6 C 5 11.6 3 13.6 3 16 C 3 18.4 5 20.4 7.5 20.4 L 13.5 20.4" stroke="#64748B" />
          <path d="M 18.5 11.6 L 24.5 11.6 C 27 11.6 29 13.6 29 16 C 29 18.4 27 20.4 24.5 20.4 L 18.5 20.4" stroke="#94A3B8" />
          <!-- Metal highlights -->
          <path d="M 6 14.5 C 5 15.2 5 16.8 6 17.5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
          <path d="M 26 14.5 C 27 15.2 27 16.8 26 17.5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
        </g>
        <!-- Collision burst at point of break -->
