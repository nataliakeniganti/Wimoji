        <path d="M 16 12 L 17.2 14.5 L 20 14 L 18.5 16 L 20 18 L 17.2 17.5 L 16 20 L 14.8 17.5 L 12 18 L 13.5 16 L 12 14 L 14.8 14.5 Z" fill="#FDE047" />
        <!-- Flying spark energy bits -->
        <g stroke="#F59E0B" stroke-width="1.5">
          <circle cx="16" cy="6" r="0.8" fill="#FDE047" />
          <circle cx="26" cy="16" r="0.8" fill="#FDE047" />
          <circle cx="16" cy="26" r="0.8" fill="#FDE047" />
          <circle cx="6" cy="16" r="0.8" fill="#FDE047" />
        </g>
      </g>
</svg>