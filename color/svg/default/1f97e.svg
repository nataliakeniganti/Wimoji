<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="hiking-boot">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Heavy rubber lug sole -->
        <rect x="3.5" y="24" width="24.5" height="4.5" rx="1" fill="#1E293B" stroke="#451A03" stroke-width="1.4" />
        <path d="M6 28.5 v-1.5 M10 28.5 v-1.5 M14 28.5 v-1.5 M18 28.5 v-1.5 M22 28.5 v-1.5" stroke="#475569" stroke-width="1.2" />
        <!-- Brown leather upper -->
        <path d="M6.5 8 H14.5 V13.5 L17.5 16.5 L24.5 18.5 C26.5 19.5 27.5 21.5 27.5 24 H4 V12 C4 9.5 5 8 6.5 8 Z" fill="#78350F" stroke="#451A03" stroke-width="1.4" />
        <!-- Padded ankle collar -->
        <rect x="6.5" y="6.5" width="8" height="3" rx="1.5" fill="#475569" stroke="#451A03" stroke-width="0.9799999999999999" />
