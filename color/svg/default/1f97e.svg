        <g stroke="#F97316" stroke-width="1.4">
          <line x1="12" y1="11" x2="15.5" y2="13" />
          <line x1="13" y1="13.5" x2="17" y2="15.5" />
          <line x1="14" y1="16" x2="19" y2="18" />
        </g>
      </g>
</svg>