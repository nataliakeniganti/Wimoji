<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="bow-and-arrow">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Recurve Wooden Bow Staff -->
        <path d="M5.5 6.5c10.5 2 16 7.5 18 18" stroke="#D97706" stroke-width="3" fill="none" />
        <!-- Taut Bowstring (Drawn to Arrow Nock) -->
        <line x1="5.5" y1="6.5" x2="14.5" y2="15.5" stroke="#E2E8F0" stroke-width="1.2" />
        <line x1="14.5" y1="15.5" x2="23.5" y2="24.5" stroke="#E2E8F0" stroke-width="1.2" />
        <!-- Nocked Steel Arrow Shaft -->
        <line x1="10" y1="20" x2="26" y2="4" stroke="#64748B" stroke-width="2" />
        <!-- Arrowhead -->
        <polygon points="23,4 27,3 26,7" fill="#64748B" stroke="#334155" stroke-width="0.8" />
        <!-- Feather Fletching -->
        <path d="M9 21l3-1M11 23l-1-3" stroke="#EF4444" stroke-width="1.8" />
      </g>
</svg>