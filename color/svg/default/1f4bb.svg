<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="laptop">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Display frame lid -->
        <rect x="6" y="5" width="20" height="15" rx="2" fill="#CBD5E1" stroke="#334155" stroke-width="2" />
        <!-- Screen interior (glowing sky blue) -->
        <rect x="8" y="7" width="16" height="11" fill="#38BDF8" stroke="#334155" stroke-width="1.2" />
        <!-- Code editor / app lines on screen -->
        <line x1="10" y1="10" x2="16" y2="10" stroke="#FFFFFF" stroke-width="1.2" />
        <line x1="10" y1="13" x2="20" y2="13" stroke="#FFFFFF" stroke-width="1.2" />
        <line x1="10" y1="15.5" x2="14" y2="15.5" stroke="#FFFFFF" stroke-width="1.2" />
        <!-- Laptop keyboard base -->
        <path d="M2 23 L5.5 20 H26.5 L30 23 C30.5 24 29.5 25.5 28 25.5 H4 C2.5 25.5 1.5 24 2 23 Z" fill="#94A3B8" stroke="#334155" stroke-width="2" />
        <!-- Trackpad slot -->
        <rect x="13" y="22.5" width="6" height="2" rx="0.5" fill="#F1F5F9" stroke="#334155" stroke-width="0.7" />
      </g>
</svg>