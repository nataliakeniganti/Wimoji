<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="sandwich">
<g>
        <!-- Bottom Bread Crust -->
        <polygon points="5,22 16,9 27,22" fill="#D97706" stroke="#B45309" stroke-width="1.1" stroke-linejoin="round" />
        <!-- Layered Fillings: Lettuce, Ham, Tomato, Cheese -->
        <path d="M4.5 22.5 Q16 25 27.5 22.5" stroke="#22C55E" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M5 21.5 Q16 24 27 21.5" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round" fill="none" />
        <!-- Red Tomato Slices -->
        <circle cx="11" cy="22" r="1.5" fill="#EF4444" />
        <circle cx="21" cy="22" r="1.5" fill="#EF4444" />
        <!-- Melted Yellow Cheese Drip -->
        <polygon points="14,22 17,25 19,22" fill="#FACC15" />
        <!-- Top Soft Sliced Deli Bread -->
        <polygon points="5,20.5 16,7.5 27,20.5" fill="#FDE68A" stroke="#B45309" stroke-width="1.2" stroke-linejoin="round" />
        <!-- Bread Crust Trim -->
        <line x1="5" y1="20.5" x2="16" y2="7.5" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" />
        <line x1="16" y1="7.5" x2="27" y2="20.5" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" />
      </g>
</svg>