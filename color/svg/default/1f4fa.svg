<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="television">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Antenna rabbit ears -->
        <path d="M9 3 L16 8 L23 3" stroke="#64748B" stroke-width="2" fill="none" />
        <!-- Angled legs -->
        <path d="M7 27 L5.5 30.5 M25 27 L26.5 30.5" stroke="#451A03" stroke-width="2.5" />
        <!-- TV wooden / retro cabinet -->
        <rect x="3" y="8" width="26" height="19" rx="3" fill="#78350F" stroke="#451A03" stroke-width="2" />
        <!-- CRT glowing blue screen -->
        <rect x="6" y="11" width="16" height="13" rx="2" fill="#38BDF8" stroke="#451A03" stroke-width="2" />
        <!-- Specular reflection arc on screen -->
        <path d="M8 13 C12 13 15 15 17 18" stroke="#FFFFFF" stroke-width="1.2" opacity="0.75" fill="none" />
        <!-- Rotary channel dials -->
        <circle cx="25.5" cy="13.5" r="1.5" fill="#FBBF24" stroke="#451A03" stroke-width="1.4" />
        <circle cx="25.5" cy="18.5" r="1.5" fill="#FBBF24" stroke="#451A03" stroke-width="1.4" />
        <!-- Speaker vent lines -->
        <line x1="24" y1="22.5" x2="27" y2="22.5" stroke="#451A03" stroke-width="1.4" />
      </g>
</svg>