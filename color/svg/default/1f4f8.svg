<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="camera-with-flash">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- 2D Flat Golden Flash Burst -->
        <g stroke="#F59E0B" stroke-width="2.2">
          <line x1="11" y1="5" x2="8.5" y2="2.5" />
          <line x1="7" y1="8" x2="4" y2="8" />
          <line x1="13" y1="4" x2="13" y2="1.5" />
          <line x1="17.5" y1="5" x2="20" y2="2.5" />
        </g>
        <!-- Top Flash Unit -->
        <path d="M10 11l1.5-3h9L22 11z" fill="#0F172A" stroke="#0F172A" stroke-width="0.8" />
        <rect x="8.5" y="8" width="5" height="3" rx="0.5" fill="#FDE047" stroke="#0F172A" stroke-width="0.8" />
        <!-- Flat Camera Body -->
        <rect x="3" y="11" width="26" height="17" rx="3" fill="#334155" stroke="#0F172A" stroke-width="1.2" />
        <!-- Flat Contrast Stripe -->
        <rect x="3" y="16" width="26" height="7" fill="#1E293B" opacity="0.3" />
        <!-- Flat Circular Lens System -->
        <circle cx="16" cy="19.5" r="5.5" fill="#475569" stroke="#0F172A" stroke-width="1" />
        <circle cx="16" cy="19.5" r="3.2" fill="#0F172A" />
        <circle cx="17.2" cy="18.3" r="0.9" fill="#FFFFFF" />
      </g>
</svg>