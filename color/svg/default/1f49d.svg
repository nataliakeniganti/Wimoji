<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="heart-with-ribbon">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Gift Heart Body without border -->
        <path d="M16 27s-10-6.5-10-14a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7.5-10 14-10 14z" fill="#EF4444" />
        <!-- Horizontal Satin Ribbon Band -->
        <rect x="6.8" y="14.8" width="18.4" height="3" rx="0.5" fill="#FBBF24" stroke="#D97706" stroke-width="0.5" />
        <!-- Vertical Satin Ribbon Band -->
        <rect x="14.5" y="10" width="3" height="16" rx="0.5" fill="#FBBF24" stroke="#D97706" stroke-width="0.5" />
        <!-- Tied Gift Ribbon Bow -->
        <ellipse cx="13" cy="11" rx="2.4" ry="1.6" transform="rotate(-25 13 11)" fill="#FDE047" stroke="#D97706" stroke-width="0.6" />
        <ellipse cx="19" cy="11" rx="2.4" ry="1.6" transform="rotate(25 19 11)" fill="#FDE047" stroke="#D97706" stroke-width="0.6" />
        <circle cx="16" cy="11.5" r="1.4" fill="#F59E0B" stroke="#D97706" stroke-width="0.6" />
        <!-- Ribbon hanging ends -->
        <path d="M15 13 L13.5 16.5 M17 13 L18.5 16.5" stroke="#D97706" stroke-width="1.2" />
      </g>
</svg>