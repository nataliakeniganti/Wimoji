<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="movie-camera">
<g>
        <!-- Dual Film Reels on Top -->
        <circle cx="8" cy="8" r="4.2" fill="#64748B" stroke="#1E293B" stroke-width="1" />
        <circle cx="8" cy="8" r="1.5" fill="#F8FAFC" />
        <circle cx="16" cy="8" r="4.2" fill="#64748B" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="8" r="1.5" fill="#F8FAFC" />
        <!-- Camera Body Housing -->
        <rect x="4" y="12" width="16" height="13" rx="2.5" fill="#334155" stroke="#0F172A" stroke-width="1.2" />
        <circle cx="8" cy="18.5" r="2.2" fill="#1E293B" />
        <circle cx="14" cy="16" r="1.2" fill="#EF4444" />
        <!-- Projecting Lens Cone -->
        <polygon points="20,15 28.5,10.5 28.5,21.5 20,17" fill="#64748B" stroke="#0F172A" stroke-width="1.2" />
