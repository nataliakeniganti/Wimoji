<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="tumbler-glass">
<g>
        <!-- Heavy Solid Base of Rocks Glass -->
        <path d="M9 22 L9.2 25 C9.4 26.5 10.5 27.5 12.5 27.5 H19.5 C21.5 27.5 22.6 26.5 22.8 25 L23 22 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.1" />
        <!-- Rich Amber Whiskey Liquid -->
        <path d="M8.2 14.5 L9 22.5 H23 L23.8 14.5 C20 13.8 12 15.2 8.2 14.5 Z" fill="#D97706" />
        <!-- Floating Ice Cube 1 -->
        <rect x="10.5" y="13" width="4.8" height="4.8" rx="0.9" transform="rotate(-12 12.9 15.4)" fill="#E0F2FE" stroke="#94A3B8" stroke-width="0.7" opacity="0.9" />
        <!-- Floating Ice Cube 2 -->
        <rect x="16.2" y="14.8" width="4.2" height="4.2" rx="0.8" transform="rotate(14 18.3 16.9)" fill="#E0F2FE" stroke="#94A3B8" stroke-width="0.7" opacity="0.9" />
        <!-- Glass Contour Outer Walls -->
        <path d="M7 8 L9 25 C9.2 26.5 10.5 27.5 12.5 27.5 H19.5 C21.5 27.5 22.8 26.5 23 25 L25 8 Z" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round" />
        <!-- Top Oval Rim -->
        <ellipse cx="16" cy="8" rx="9" ry="2" fill="#F8FAFC" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1" />
        <!-- Vertical Glaze Reflection on Glass Side -->
        <line x1="8.5" y1="11" x2="10" y2="23" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4" />
      </g>
</svg>