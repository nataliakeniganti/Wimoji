        <!-- Track Rails -->
        <line x1="4" y1="28" x2="28" y2="28" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <line x1="9" y1="25" x2="7" y2="28" stroke="#94A3B8" stroke-width="2" />
