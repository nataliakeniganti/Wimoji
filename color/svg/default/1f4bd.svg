<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="minidisc">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Square plastic cartridge casing -->
        <rect x="4" y="4" width="24" height="24" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="2" />
        <!-- Circular optical disc visible inside -->
        <circle cx="16" cy="16" r="8.5" fill="#94A3B8" stroke="#334155" stroke-width="1.6" />
        <circle cx="16" cy="16" r="3" fill="#E2E8F0" stroke="#334155" stroke-width="1.4" />
        <!-- Sliding metal shutter at top edge -->
        <rect x="11" y="4" width="10" height="8" rx="0.5" fill="#64748B" stroke="#334155" stroke-width="1.4" />
        <line x1="14" y1="6" x2="18" y2="6" stroke="#CBD5E1" stroke-width="1" />
      </g>
</svg>