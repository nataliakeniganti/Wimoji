<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="safety-pin">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Coiled Spring at Bottom -->
        <circle cx="8" cy="24" r="3" fill="none" stroke="#475569" stroke-width="2.2" />
        <!-- Back Pin Shaft -->
        <line x1="10" y1="22" x2="23" y2="9" stroke="#94A3B8" stroke-width="2.2" />
        <!-- Front Needle Shaft -->
        <line x1="6.5" y1="22" x2="20" y2="8.5" stroke="#CBD5E1" stroke-width="1.8" />
        <!-- Clasp Head Cap -->
        <g transform="rotate(-45 22 8)">
          <rect x="17.5" y="5.5" width="9" height="5.5" rx="2.5" fill="#94A3B8" stroke="#475569" stroke-width="1" />
          <circle cx="19.5" cy="8.2" r="1" fill="#FFFFFF" />
        </g>
      </g>
</svg>