<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="microphone">
<g transform="rotate(-45 16 16)">
        <!-- Microphone Mesh Ball Grille -->
        <circle cx="16" cy="7.5" r="5.5" fill="#94A3B8" stroke="#475569" stroke-width="1.2" />
        <line x1="11" y1="7.5" x2="21" y2="7.5" stroke="#334155" stroke-width="1" />
        <line x1="16" y1="2.5" x2="16" y2="12.5" stroke="#334155" stroke-width="1" />
        <!-- Handle Body (Blue) -->
        <polygon points="13.5,13 18.5,13 17,25 15,25" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.2" />
        <!-- On/Off Switch -->
        <rect x="15" y="16" width="2" height="3" rx="0.5" fill="#FBBF24" />
        <!-- Cable Base -->
        <rect x="15" y="25" width="2" height="2" fill="#0F172A" />
      </g>
</svg>