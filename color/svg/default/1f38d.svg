        <path d="M6 18c1-3 3-5 5-6M6 20c2-2 4-3 6-4" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" />
        <path d="M26 18c-1-3-3-5-5-6M26 20c-2-2-4-3-6-4" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" />
        <!-- Woven Straw Rope Tub Base (Komozumi) -->
        <rect x="8" y="19" width="16" height="9" rx="2" fill="#D97706" stroke="#92400E" stroke-width="1" />
        <!-- Red Mizuhiki knot cord -->
        <line x1="8" y1="23.5" x2="24" y2="23.5" stroke="#EF4444" stroke-width="1.6" />
        <circle cx="16" cy="23.5" r="1.5" fill="#EF4444" />
