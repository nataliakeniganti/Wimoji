<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="pine-decoration">
<g>
        <!-- Center Tall Diagonally Cut Bamboo Shoot -->
        <polygon points="14,6 18,3 18,20 14,20" fill="#22C55E" stroke="#15803D" stroke-width="0.8" />
        <ellipse cx="16" cy="4.5" rx="2" ry="1.2" fill="#86EFAC" />
        <!-- Left Bamboo Shoot -->
        <polygon points="9.5,10 13.5,7 13.5,20 9.5,20" fill="#22C55E" stroke="#15803D" stroke-width="0.8" />
        <ellipse cx="11.5" cy="8.5" rx="2" ry="1.2" fill="#86EFAC" />
        <!-- Right Bamboo Shoot -->
        <polygon points="18.5,10 22.5,7 22.5,20 18.5,20" fill="#22C55E" stroke="#15803D" stroke-width="0.8" />
        <ellipse cx="20.5" cy="8.5" rx="2" ry="1.2" fill="#86EFAC" />
