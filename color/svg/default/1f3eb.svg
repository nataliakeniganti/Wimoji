        <line x1="16" y1="9.6" x2="16" y2="10.5" stroke="#0F172A" stroke-width="0.5" />
        <line x1="16" y1="10.5" x2="16.8" y2="10.5" stroke="#0F172A" stroke-width="0.5" />
        <!-- Brick Schoolhouse Building -->
