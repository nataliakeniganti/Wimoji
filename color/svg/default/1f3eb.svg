        <rect x="7" y="21.5" width="3.5" height="3.5" rx="0.5" fill="#38BDF8" />
        <rect x="21.5" y="21.5" width="3.5" height="3.5" rx="0.5" fill="#38BDF8" />
        <!-- Wooden Double Doors -->
