        <polygon points="16,3 12,8 20,8" fill="#EF4444" stroke="#991B1B" stroke-width="1" />
        <rect x="13" y="8" width="6" height="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
