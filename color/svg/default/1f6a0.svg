<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="mountain-cableway">
<g>
        <!-- Mountain Silhouette in Background -->
        <polygon points="2,30 10,18 19,25 28,14 30,30" fill="#E2E8F0" />
        <!-- Diagonal Heavy Cable Line -->
        <line x1="2" y1="6" x2="30" y2="14" stroke="#475569" stroke-width="2" stroke-linecap="round" />
