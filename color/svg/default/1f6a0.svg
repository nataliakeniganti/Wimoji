        <circle cx="16" cy="10" r="2" fill="#1E293B" />
        <path d="M16 10v6l-2 3" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <!-- Gondola Cabin Body -->
        <rect x="8" y="17" width="16" height="12" rx="3.5" fill="#E11D48" stroke="#9F1239" stroke-width="1.2" />
        <!-- Panoramic Windows -->
        <rect x="10.5" y="19.5" width="11" height="5.5" rx="1" fill="#BAE6FD" stroke="#0284C7" stroke-width="0.6" />
        <line x1="16" y1="19.5" x2="16" y2="25" stroke="#0284C7" stroke-width="0.6" />
      </g>
</svg>