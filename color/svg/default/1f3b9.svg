        <!-- Key Separator Lines -->
        <line x1="8.8" y1="6" x2="8.8" y2="26" stroke="#CBD5E1" stroke-width="1" />
        <line x1="13.6" y1="6" x2="13.6" y2="26" stroke="#CBD5E1" stroke-width="1" />
        <line x1="18.4" y1="6" x2="18.4" y2="26" stroke="#CBD5E1" stroke-width="1" />
        <line x1="23.2" y1="6" x2="23.2" y2="26" stroke="#CBD5E1" stroke-width="1" />
        <!-- Black Keys -->
        <rect x="7.2" y="6" width="3.2" height="12" fill="#0F172A" rx="0.5" />
        <rect x="12.2" y="6" width="3.2" height="12" fill="#0F172A" rx="0.5" />
        <rect x="17.8" y="6" width="3.2" height="12" fill="#0F172A" rx="0.5" />
        <rect x="22.2" y="6" width="3.2" height="12" fill="#0F172A" rx="0.5" />
