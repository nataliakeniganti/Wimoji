        <!-- Tooth Carved Jagged Smile -->
        <polygon points="9.5,22 13,20.5 16,22.5 19,20.5 22.5,22 20,25.5 16,24.5 12,25.5" fill="#FEF08A" stroke="#9A3412" stroke-width="0.8" />
      </g>
