<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="radio">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Antenna -->
        <line x1="6" y1="11" x2="26" y2="2.5" stroke="#94A3B8" stroke-width="1.8" />
        <circle cx="26" cy="2.5" r="1.2" fill="#EF4444" />
        <!-- Wooden/Retro Radio Housing -->
        <rect x="3" y="11" width="26" height="17" rx="3" fill="#D97706" stroke="#78350F" stroke-width="1.2" />
        <!-- Speaker Mesh Grille -->
        <circle cx="11" cy="19.5" r="5" fill="#1E293B" stroke="#78350F" stroke-width="1" />
        <circle cx="11" cy="19.5" r="2.2" fill="#475569" />
        <!-- Frequency Dial Window -->
        <rect x="18" y="14" width="8.5" height="4.5" rx="1" fill="#FEF3C7" stroke="#78350F" stroke-width="0.8" />
        <line x1="22" y1="14.5" x2="22" y2="18" stroke="#DC2626" stroke-width="1.2" />
        <!-- Control Knobs -->
        <circle cx="20" cy="23.5" r="1.8" fill="#F1F5F9" stroke="#78350F" stroke-width="0.8" />
        <circle cx="24.5" cy="23.5" r="1.8" fill="#F1F5F9" stroke="#78350F" stroke-width="0.8" />
      </g>
</svg>