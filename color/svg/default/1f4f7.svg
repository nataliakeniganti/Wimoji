        <rect x="5.5" y="6" width="3.5" height="3" rx="0.8" fill="#EF4444" stroke="#0F172A" stroke-width="1" />
        <!-- Flat Camera Main Body -->
        <rect x="3" y="9" width="26" height="18" rx="3.5" fill="#64748B" stroke="#0F172A" stroke-width="1.2" />
