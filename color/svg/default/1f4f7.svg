        <rect x="3" y="14" width="26" height="8" fill="#1E293B" opacity="0.3" stroke="#0F172A" stroke-width="0.8" />
        <!-- Flat Concentric Circular Lens System -->
        <circle cx="16" cy="18" r="6" fill="#334155" stroke="#0F172A" stroke-width="1.2" />
