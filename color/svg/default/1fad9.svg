<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="jar">
<g>
        <!-- Glass Jar Body -->
        <rect x="8" y="9" width="16" height="18" rx="3.5" fill="#E2E8F0" opacity="0.35" stroke="#64748B" stroke-width="1.2" />
        <!-- Threaded Glass Collar -->
        <rect x="11" y="7" width="10" height="2.5" fill="#CBD5E1" stroke="#64748B" stroke-width="0.8" />
