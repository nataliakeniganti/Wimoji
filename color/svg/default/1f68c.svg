<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="bus">
<g>
        <!-- Yellow City Bus Body -->
        <rect x="3" y="8" width="26" height="15" rx="3" fill="#EAB308" stroke="#A16207" stroke-width="1.2" />
        <!-- Black Side Trim Stripe -->
        <line x1="3" y1="18" x2="29" y2="18" stroke="#0F172A" stroke-width="1.2" />
        <!-- Windows -->
        <rect x="6" y="10.5" width="5" height="5" rx="1" fill="#38BDF8" />
        <rect x="13.5" y="10.5" width="5" height="5" rx="1" fill="#38BDF8" />
        <rect x="21" y="10.5" width="5" height="5" rx="1" fill="#38BDF8" />
        <!-- Headlight and Taillight -->
        <circle cx="28" cy="15" r="1" fill="#FDE047" />
        <circle cx="4" cy="15" r="1" fill="#EF4444" />
        <!-- Rubber Wheels -->
        <circle cx="8" cy="24" r="2.8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
        <circle cx="24" cy="24" r="2.8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      </g>
</svg>