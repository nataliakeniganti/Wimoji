<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="treasure-chest">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Domed Wooden Lid -->
        <path d="M4 14 C4 8 9 5 16 5 C23 5 28 8 28 14 Z" fill="#92400E" stroke="#451A03" stroke-width="2" />
        <!-- Base Wooden Chest Box -->
        <rect x="4" y="14" width="24" height="13" rx="1.5" fill="#78350F" stroke="#451A03" stroke-width="2" />
        <!-- Horizontal Wood Planks -->
        <line x1="4" y1="19" x2="28" y2="19" stroke="#451A03" stroke-width="0.8" />
        <line x1="4" y1="23" x2="28" y2="23" stroke="#451A03" stroke-width="0.8" />
        <!-- Side Drop Handles -->
        <path d="M4 17.5 C2 17.5 2 21.5 4 21.5" fill="none" stroke="#F59E0B" stroke-width="1.4" />
        <path d="M28 17.5 C30 17.5 30 21.5 28 21.5" fill="none" stroke="#F59E0B" stroke-width="1.4" />
        <!-- Brass Vertical Straps -->
        <rect x="8.5" y="5.6" width="3" height="21.4" rx="0.5" fill="#F59E0B" stroke="#451A03" stroke-width="0.8" />
        <rect x="20.5" y="5.6" width="3" height="21.4" rx="0.5" fill="#F59E0B" stroke="#451A03" stroke-width="0.8" />
        <!-- Horizontal Rim Band -->
        <rect x="3.5" y="13" width="25" height="2.2" rx="0.4" fill="#FBBF24" stroke="#451A03" stroke-width="0.8" />
        <!-- Stud Rivets on Straps -->
        <circle cx="10" cy="8.5" r="0.55" fill="#FEF08A" />
        <circle cx="10" cy="17" r="0.55" fill="#FEF08A" />
        <circle cx="10" cy="24" r="0.55" fill="#FEF08A" />
        <circle cx="22" cy="8.5" r="0.55" fill="#FEF08A" />
        <circle cx="22" cy="17" r="0.55" fill="#FEF08A" />
        <circle cx="22" cy="24" r="0.55" fill="#FEF08A" />
        <!-- Center Gold Lock Hasp with Keyhole -->
        <rect x="14" y="11.8" width="4" height="5.8" rx="0.8" fill="#FBBF24" stroke="#451A03" stroke-width="0.8" />
        <circle cx="16" cy="13.8" r="0.7" fill="#451A03" />
        <polygon points="15.5,14.2 15.3,16.2 16.7,16.2 16.5,14.2" fill="#451A03" />
      </g>
</svg>