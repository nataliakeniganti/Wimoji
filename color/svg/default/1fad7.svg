<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="pouring-liquid">
<g>
        <!-- Pouring Water Stream -->
        <path d="M13 10c2 4 5 10 5 17 0 1-1 2-2 2s-2-1-2-2c0-5-3-10-5-15l4-2z" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" />
        <!-- Splash Droplets -->
        <circle cx="23" cy="21" r="1.3" fill="#38BDF8" />
        <circle cx="20" cy="27" r="1.5" fill="#38BDF8" />
        <circle cx="15" cy="28" r="1.2" fill="#38BDF8" />
        <!-- Tilted Clear Glass Body -->
        <path d="M8 8L3.5 15.5c-.5 1 0 2 1 2.5l5 3c1 .5 2 0 2.5-1L14 11z" fill="#94A3B8" opacity="0.3" stroke="#64748B" stroke-width="1" />
        <!-- Glass Rim Lip -->
        <ellipse cx="11" cy="9" rx="4.2" ry="2.2" transform="rotate(-35 11 9)" fill="#E2E8F0" stroke="#64748B" stroke-width="1" opacity="0.6" />
        <!-- Water level inside glass -->
        <path d="M6 13l4-3 2 4-4 3z" fill="#38BDF8" opacity="0.6" />
        <!-- Highlight reflections on glass -->
        <line x1="5.5" y1="14" x2="9" y2="19" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
      </g>
</svg>