<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="fax-machine">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Feeding document paper -->
        <path d="M10 9 V4 C10 3.5 10.5 3 11 3 H21 C21.5 3 22 3.5 22 4 V9 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4" />
        <line x1="13" y1="5.5" x2="19" y2="5.5" stroke="#94A3B8" stroke-width="1" />
        <!-- Fax console body -->
        <rect x="4" y="9" width="24" height="17" rx="2.5" fill="#475569" stroke="#0F172A" stroke-width="2" />
        <!-- Handset on left -->
        <rect x="5.5" y="11" width="4.5" height="13" rx="1.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.4" />
        <!-- LCD screen -->
        <rect x="12" y="12" width="13" height="4" rx="1" fill="#BBF7D0" stroke="#0F172A" stroke-width="1.4" />
        <line x1="14" y1="14" x2="21" y2="14" stroke="#15803D" stroke-width="1" />
        <!-- Keypad buttons -->
        <g stroke="#0F172A" stroke-width="1.2">
          <line x1="13" y1="19" x2="15" y2="19" />
          <line x1="17.5" y1="19" x2="19.5" y2="19" />
          <line x1="22" y1="19" x2="24" y2="19" />
          <line x1="13" y1="22" x2="15" y2="22" />
          <line x1="17.5" y1="22" x2="19.5" y2="22" />
          <line x1="22" y1="22" x2="24" y2="22" />
        </g>
      </g>
</svg>