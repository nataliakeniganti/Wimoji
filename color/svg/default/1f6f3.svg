<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="passenger-ship">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Ocean Waves -->
        <path d="M2 26c3-1 6-1 9 0s6 1 9 0 6-1 9 0" stroke="#0284C7" stroke-width="2" fill="none" />
        <!-- Smokestacks (Red with Black Tip) -->
        <rect x="12" y="7" width="2.5" height="4" fill="#EF4444" />
        <rect x="12" y="7" width="2.5" height="1" fill="#0F172A" />
        <rect x="17.5" y="7" width="2.5" height="4" fill="#EF4444" />
        <rect x="17.5" y="7" width="2.5" height="1" fill="#0F172A" />
        <!-- Upper Observation Bridge &amp; Decks -->
        <rect x="9" y="11" width="14" height="4.5" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
        <!-- Middle Stateroom Cabin Deck -->
        <rect x="6.5" y="15.5" width="19" height="5" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
        <!-- Porthole Window Rows -->
        <circle cx="10" cy="18" r="0.8" fill="#0284C7" />
        <circle cx="13" cy="18" r="0.8" fill="#0284C7" />
        <circle cx="16" cy="18" r="0.8" fill="#0284C7" />
        <circle cx="19" cy="18" r="0.8" fill="#0284C7" />
        <circle cx="22" cy="18" r="0.8" fill="#0284C7" />
        <!-- Heavy Navy Hull -->
        <path d="M3 20.5l3.5 5h19l3.5-5H3z" fill="#1E293B" stroke="#0F172A" stroke-width="1.2" />
      </g>
</svg>