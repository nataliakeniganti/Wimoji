<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="old-personal-computer">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Open Display Lid (Top Clamshell) -->
        <path d="M5.5 3 H26.5 C27.3 3 28 3.7 28 4.5 V15 H4 V4.5 C4 3.7 4.7 3 5.5 3 Z" fill="#E2E8F0" stroke="#334155" stroke-width="2" />
        <!-- Active Matrix LCD Display Panel -->
        <rect x="6.8" y="4.8" width="18.4" height="8.6" rx="0.8" fill="#94A3B8" stroke="#334155" stroke-width="1.2100000000000002" />
        <!-- Screen Desktop UI: Classic Mac Menu Bar &amp; Finder Window -->
        <line x1="7.4" y1="6.2" x2="24.6" y2="6.2" stroke="#334155" stroke-width="0.75" />
        <rect x="12" y="7.4" width="8" height="4.8" rx="0.4" fill="#F8FAFC" stroke="#334155" stroke-width="0.65" />
        <line x1="13.4" y1="9" x2="18.6" y2="9" stroke="#334155" stroke-width="0.55" />
        <line x1="13.4" y1="10.3" x2="17.2" y2="10.3" stroke="#334155" stroke-width="0.55" />
        <circle cx="7.6" cy="14" r="0.5" fill="#10B981" />
        <!-- Display Hinges -->
        <rect x="6.8" y="14.5" width="3" height="1.8" fill="#CBD5E1" stroke="#334155" stroke-width="0.8" />
        <rect x="22.2" y="14.5" width="3" height="1.8" fill="#CBD5E1" stroke="#334155" stroke-width="0.8" />

        <!-- Base Chassis (Sloping Keyboard Wedge) -->
        <path d="M4 16 H28 L29 26.2 C29 27.2 28.2 28 27.2 28 H4.8 C3.8 28 3 27.2 3 26.2 Z" fill="#E2E8F0" stroke="#334155" stroke-width="2" />
        
        <!-- Snow White Horizontal Cooling Grooves -->
        <line x1="5" y1="26.8" x2="27" y2="26.8" stroke="#334155" stroke-width="0.65" opacity="0.4" />

        <!-- Built-in Mechanical Keyboard Deck (Alps switches) -->
        <rect x="5.5" y="17.6" width="13.5" height="7.6" rx="0.6" fill="#334155" stroke="#334155" stroke-width="1.1" />
        <g stroke="#CBD5E1" stroke-width="0.65" opacity="0.85">
          <line x1="6.5" y1="19.5" x2="18" y2="19.5" />
          <line x1="6.5" y1="21.4" x2="18" y2="21.4" />
          <line x1="6.5" y1="23.3" x2="18" y2="23.3" />
          <line x1="9.5" y1="24.2" x2="15" y2="24.2" stroke-width="0.85" stroke="#F8FAFC" />
        </g>

        <!-- Built-in Modular Trackball (Iconic 1989 Macintosh Portable Feature) -->
        <circle cx="23.5" cy="20.8" r="3.2" fill="#CBD5E1" stroke="#334155" stroke-width="1.1" />
        <circle cx="23.5" cy="20.8" r="2.3" fill="#334155" stroke="#334155" stroke-width="0.65" />
        <circle cx="22.8" cy="20.1" r="0.55" fill="#FFFFFF" opacity="0.6" />
        <path d="M21.2 24.8 C22.6 25.4 24.4 25.4 25.8 24.8" fill="none" stroke="#334155" stroke-width="0.75" />

        <!-- Front Integrated Carrying Handle (Luggable Form Factor) -->
        <path d="M11 28 V29.8 C11 30.5 11.5 31 12.2 31 H19.8 C20.5 31 21 30.5 21 29.8 V28" fill="#CBD5E1" stroke="#334155" stroke-width="2" />
        <line x1="13.5" y1="29.5" x2="18.5" y2="29.5" stroke="#334155" stroke-width="0.75" />
      </g>
</svg>