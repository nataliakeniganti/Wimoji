<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="flashlight">
<g transform="rotate(45 16 16)" stroke-linecap="round" stroke-linejoin="round">
        <!-- Light rays -->
        <g stroke="#FBBF24" stroke-width="2" fill="none">
          <line x1="16" y1="4.5" x2="16" y2="1.5" />
          <line x1="10.5" y1="6" x2="8" y2="3.5" />
          <line x1="21.5" y1="6" x2="24" y2="3.5" />
        </g>
        <g stroke="#1E293B" stroke-width="2">
          <!-- Barrel -->
          <rect x="12.5" y="13" width="7" height="15" rx="2" fill="#475569" />
          <!-- Flared head -->
          <path d="M10.5 7.5 H21.5 L19.5 13 H12.5 Z" fill="#64748B" />
        </g>
        <!-- Glowing lens -->
        <line x1="11.2" y1="7.5" x2="20.8" y2="7.5" stroke="#FEF08A" stroke-width="2" />
        <!-- Switch -->
        <rect x="15" y="17" width="2" height="4" rx="1" fill="#EF4444" stroke="none" />
