<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="aerial-tramway">
<g>
        <!-- Horizontal Cable -->
        <line x1="2" y1="5.5" x2="30" y2="5.5" stroke="#475569" stroke-width="2" stroke-linecap="round" />
        <!-- Double Trolley Wheels &amp; Hanger -->
        <circle cx="13" cy="5.5" r="2" fill="#1E293B" />
        <circle cx="19" cy="5.5" r="2" fill="#1E293B" />
        <polygon points="12,5.5 20,5.5 17,13.5 15,13.5" fill="#475569" />
        <!-- Large Tram Cabin -->
        <rect x="5.5" y="13.5" width="21" height="14" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="1.2" />
        <!-- Cabin Windows -->
        <rect x="8.5" y="16.5" width="6.5" height="6.5" rx="0.8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.6" />
        <rect x="17" y="16.5" width="6.5" height="6.5" rx="0.8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.6" />
        <!-- Floor Skid Beam -->
        <line x1="7.5" y1="28.5" x2="24.5" y2="28.5" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
      </g>
</svg>