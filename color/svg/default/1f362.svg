<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="oden">
<g>
        <!-- Wooden skewer stick -->
        <line x1="16" y1="2" x2="16" y2="30" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" />
        <!-- Bottom Chikuwa (fish cake roll) -->
        <rect x="10.5" y="21" width="11" height="5.5" rx="1.8" fill="#FB923C" stroke="#C2410C" stroke-width="1" />
        <ellipse cx="16" cy="23.7" rx="3.5" ry="1.2" fill="#EA580C" opacity="0.4" />
        <!-- Middle Round Egg / Ball -->
        <circle cx="16" cy="16.5" r="4.2" fill="#FBBF24" stroke="#D97706" stroke-width="1" />
        <circle cx="14.5" cy="15" r="1" fill="#FFFFFF" opacity="0.4" />
        <!-- Top Triangular Konjac -->
        <polygon points="16,4 9.5,12.5 22.5,12.5" fill="#A8A29E" stroke="#57534E" stroke-width="1" />
        <!-- Konjac speckles -->
        <circle cx="14" cy="9" r="0.6" fill="#44403C" />
        <circle cx="18" cy="10" r="0.5" fill="#44403C" />
        <circle cx="16" cy="7" r="0.5" fill="#44403C" />
      </g>
</svg>