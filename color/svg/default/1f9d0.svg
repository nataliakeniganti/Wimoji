<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="face-with-monocle">
<g>
        <ellipse cx="16" cy="16" rx="12.5" ry="12.5" fill="#FFCA28" stroke="#FFA000" stroke-width="0.8" />
        <ellipse cx="16" cy="15" rx="11" ry="11" opacity="0.3" fill="#FFE082" />
        <!-- Prominent raised left eyebrow -->
        <path d="M8.5 7.5 C10.5 5.5 13.5 5.5 14.5 7.5" stroke="#78350F" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <!-- Lowered flat skeptical right eyebrow -->
        <path d="M17.5 12.5 C19.5 12 21.5 12 23.5 12.8" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" fill="none" />
        <!-- Big wide inquisitive left eye -->
        <ellipse cx="11.5" cy="12" rx="2.2" ry="2.7" fill="#37474F" />
        <ellipse cx="12" cy="11" rx="0.7" ry="0.7" fill="#FFFFFF" />
        <!-- Squinting skeptical right eye -->
        <ellipse cx="20.5" cy="14.2" rx="1.6" ry="1.3" fill="#37474F" />
        <ellipse cx="21" cy="13.8" rx="0.5" ry="0.5" fill="#FFFFFF" />
        <!-- Skeptical flat mouth -->
        <path d="M12 21 C14.5 20.2 17.5 20.2 20 21" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" fill="none" />
        <!-- Gold Monocle Lens, Rim &amp; Hanging Chain -->
        <circle cx="11.5" cy="12" r="4.2" fill="#E0F2FE" opacity="0.28" />
        <path d="M9.4 9.8 L11 8.8" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.75" />
        <circle cx="11.5" cy="12" r="4.2" fill="none" stroke="#D97706" stroke-width="1.4" />
        <path d="M7.6 13.4 C6.8 18 7.8 23 10.2 26.8" fill="none" stroke="#D97706" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.2 1.6" />
      </g>
</svg>