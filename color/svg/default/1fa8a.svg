<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="trombone">
<g>
        <!-- Mouthpiece Left -->
        <rect x="3.5" y="15.8" width="2.5" height="2.4" rx="0.5" fill="#64748B" />
        <!-- Slide Tube (Upper &amp; Lower with front U-curve) -->
        <path d="M6 17 H26 A 2.5 2.5 0 0 1 26 22 H6" fill="none" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Rear Tuning Slide U-bend (Curves back and up to bell tube) -->
        <path d="M7 17 C2.5 17 2.5 10 7 10 H18" fill="none" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Flared Bell Horn Right -->
        <polygon points="18,11.2 25.5,5.5 25.5,16.5 18,12.8" fill="#FBBF24" stroke="#B45309" stroke-width="1" />
        <ellipse cx="25.5" cy="11" rx="1.4" ry="5.5" fill="#78350F" />
        <!-- Cross Braces -->
        <line x1="10" y1="10" x2="10" y2="17" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" />
        <line x1="13" y1="17" x2="13" y2="22" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" />
      </g>
</svg>