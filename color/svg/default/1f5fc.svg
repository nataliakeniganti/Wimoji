<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="tokyo-tower">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Spire Antenna Pin -->
        <line x1="16" y1="2" x2="16" y2="7" stroke="#EF4444" stroke-width="1.8" />
        <!-- White Upper Spire Band -->
        <polygon points="15,7 17,7 17.5,10 14.5,10" fill="#F8FAFC" stroke="#991B1B" stroke-width="0.8" />
        <!-- Red Mid Spire Band -->
        <polygon points="14.5,10 17.5,10 18,13 14,13" fill="#EF4444" stroke="#991B1B" stroke-width="0.8" />
        <!-- Upper Observation Deck (White) -->
        <rect x="13" y="13" width="6" height="2.2" rx="0.5" fill="#F8FAFC" stroke="#991B1B" stroke-width="0.8" />
        <!-- Main Tower Red Truss -->
        <polygon points="14,15.2 18,15.2 19,20 13,20" fill="#EF4444" stroke="#991B1B" stroke-width="0.8" />
        <!-- Lower Observation Main Deck -->
        <rect x="11.5" y="20" width="9" height="2.5" rx="0.5" fill="#F8FAFC" stroke="#991B1B" stroke-width="0.8" />
        <!-- Splayed Lower Arch Legs -->
        <path d="M12.5 22.5L6.5 29h4.5l2.5-4 2.5 2 2.5-2 2.5 4h4.5l-6-6.5z" fill="#EF4444" stroke="#991B1B" stroke-width="1" />
      </g>
</svg>