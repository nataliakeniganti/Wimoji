        <circle cx="9.6" cy="19.4" r="0.5" fill="#FFFFFF" />
        <circle cx="13.2" cy="19.4" r="0.5" fill="#FFFFFF" />
        <circle cx="11.4" cy="20.8" r="0.7" fill="#0F172A" />
