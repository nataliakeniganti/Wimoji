<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="party-popper">
<g>
        <!-- Confetti streamers &amp; stars shooting out -->
        <line x1="17" y1="12" x2="27" y2="4" stroke="#EF4444" stroke-width="2" stroke-linecap="round" />
        <line x1="20" y1="16" x2="29" y2="18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
        <line x1="13" y1="9" x2="16" y2="3" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />
        <!-- Floating colorful confetti dots -->
        <circle cx="22" cy="7" r="1.8" fill="#FBBF24" />
        <circle cx="26" cy="11" r="1.5" fill="#A855F7" />
        <circle cx="15" cy="5" r="1.5" fill="#EF4444" />
        <circle cx="21" cy="22" r="1.2" fill="#38BDF8" />
        <!-- Party Popper Cone (tilted striped horn) -->
        <polygon points="4,28 15,13 22,20" fill="#FBBF24" stroke="#D97706" stroke-width="1.2" />
        <!-- Horn colorful stripes -->
        <polygon points="7,24 11,19 13.5,21.5 9,26.5" fill="#EF4444" />
        <polygon points="11,19 15,13 18,16 13.5,21.5" fill="#38BDF8" />
        <!-- Open mouth rim -->
        <line x1="15" y1="13" x2="22" y2="20" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" />
      </g>
</svg>