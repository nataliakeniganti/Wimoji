<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="popcorn">
<g>
        <!-- Popcorn Bucket (trapezoid cup) -->
