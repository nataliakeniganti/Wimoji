        <!-- Buttery Popcorn Kernels Heaping on Top -->
        <circle cx="9" cy="11.5" r="2.8" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.6" />
        <circle cx="23" cy="11.5" r="2.8" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.6" />
        <circle cx="12.5" cy="9.5" r="3.2" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.6" />
        <circle cx="19.5" cy="9.5" r="3.2" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.6" />
        <circle cx="16" cy="8" r="3.5" fill="#FDE047" stroke="#CA8A04" stroke-width="0.8" />
        <!-- Butter drops / highlights -->
        <circle cx="15.2" cy="7.2" r="1" fill="#FFFFFF" opacity="0.6" />
      </g>
</svg>