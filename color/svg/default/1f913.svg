        <rect x="15" y="12.5" width="2" height="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.5" />
        <!-- Smiling mouth cavity -->
        <path d="M10.5 19.5 C10.5 24 21.5 24 21.5 19.5 Z" fill="#37474F" />
