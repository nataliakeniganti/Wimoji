<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="kiwi-fruit">
<g>
        <!-- Fuzzy Brown Outer Kiwi Skin / Rind -->
        <circle cx="16" cy="16" r="12.5" fill="#78350F" stroke="#78350F" stroke-width="0.8" />
        <!-- Tangy Emerald Green Flesh -->
        <circle cx="16" cy="16" r="11.2" fill="#84CC16" stroke="#4D7C0F" stroke-width="0.8" />
