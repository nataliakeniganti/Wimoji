<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="motorized-wheelchair">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Backrest cushion &amp; upright -->
        <path d="M21.4 4.8 V17.2" stroke="#334155" stroke-width="3.2" fill="none" />
        <path d="M21.4 4.8 V17.2" stroke="#0F172A" stroke-width="1" fill="none" />
        <!-- Footrest strut -->
        <path d="M10.4 18.8 L7.4 24.8 H4.2" stroke="#94A3B8" stroke-width="2" fill="none" />
        <!-- Seat cushion &amp; joystick armrest -->
        <rect x="10" y="15.2" width="11.4" height="2.6" rx="1.1" fill="#334155" stroke="#0F172A" stroke-width="0.9" />
        <path d="M12 13.4 H18.6 M12.2 13.4 L11.6 11" stroke="#94A3B8" stroke-width="1.5" fill="none" />
        <circle cx="11.6" cy="10.6" r="1" fill="#EF4444" stroke="#0F172A" stroke-width="0.6" />
        <!-- Power motor battery body -->
        <rect x="10.6" y="17.8" width="11" height="5.4" rx="1.4" fill="#EF4444" stroke="#0F172A" stroke-width="1.1" />
        <!-- Front caster wheel -->
        <circle cx="8" cy="26.2" r="2.2" fill="#334155" stroke="#0F172A" stroke-width="1" />
        <circle cx="8" cy="26.2" r="0.8" fill="#94A3B8" />
        <!-- Rear rugged drive wheel -->
        <circle cx="17.8" cy="24.2" r="4.4" fill="#334155" stroke="#0F172A" stroke-width="1.1" />
        <circle cx="17.8" cy="24.2" r="2.3" fill="#94A3B8" stroke="#0F172A" stroke-width="0.8" />
        <circle cx="17.8" cy="24.2" r="0.8" fill="#0F172A" />
      </g>
