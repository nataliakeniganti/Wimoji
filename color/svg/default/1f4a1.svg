<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="light-bulb">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Glow rays radiating from bulb -->
        <g stroke="#F59E0B" stroke-width="1.8">
          <line x1="16" y1="1" x2="16" y2="2.5" />
          <line x1="5.5" y1="5.5" x2="7" y2="7" />
          <line x1="26.5" y1="5.5" x2="25" y2="7" />
          <line x1="3" y1="12.5" x2="5" y2="12.5" />
          <line x1="29" y1="12.5" x2="27" y2="12.5" />
        </g>
        <!-- Glass bulb body -->
        <path d="M16 4 C11 4 8 7.5 8 12.5 C8 16 10.5 18.5 12 21 H20 C21.5 18.5 24 16 24 12.5 C24 7.5 21 4 16 4 Z" fill="#FBBF24" stroke="#D97706" stroke-width="0.8" />
        <!-- Inner glass highlight -->
        <path d="M11 8 C9.5 10 9.5 13 10.5 15" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity="0.6" />
        <!-- Tungsten filament -->
        <path d="M13.5 16 L14.5 12 L16 14 L17.5 12 L18.5 16" stroke="#D97706" stroke-width="1.4" fill="none" />
        <!-- Metallic screw base threads -->
        <rect x="12" y="21" width="8" height="2" rx="0.5" fill="#94A3B8" stroke="#64748B" stroke-width="0.6" />
        <rect x="12.5" y="23.2" width="7" height="2" rx="0.5" fill="#94A3B8" stroke="#64748B" stroke-width="0.6" />
        <!-- Contact base tip -->
        <path d="M14 25.5 C14 27.5 18 27.5 18 25.5 Z" fill="#475569" />
      </g>
</svg>