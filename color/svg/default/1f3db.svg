        <rect x="6" y="13.5" width="2.5" height="10.5" fill="#E2E8F0" stroke="#1E293B" stroke-width="0.8" />
        <rect x="11.8" y="13.5" width="2.5" height="10.5" fill="#E2E8F0" stroke="#1E293B" stroke-width="0.8" />
        <rect x="17.8" y="13.5" width="2.5" height="10.5" fill="#E2E8F0" stroke="#1E293B" stroke-width="0.8" />
        <rect x="23.5" y="13.5" width="2.5" height="10.5" fill="#E2E8F0" stroke="#1E293B" stroke-width="0.8" />
        <!-- Stepped Base Plinth Podium -->
        <rect x="3.5" y="24" width="25" height="2" fill="#94A3B8" stroke="#1E293B" stroke-width="0.8" />
        <rect x="2" y="26" width="28" height="2.5" rx="0.5" fill="#E2E8F0" stroke="#1E293B" stroke-width="1" />
