<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="film-projector">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Film Reels on Top -->
        <circle cx="9" cy="8" r="4.5" fill="#94A3B8" stroke="#0F172A" stroke-width="1" />
        <circle cx="9" cy="8" r="1.5" fill="#334155" />
        <circle cx="20" cy="8" r="4.5" fill="#94A3B8" stroke="#0F172A" stroke-width="1" />
        <circle cx="20" cy="8" r="1.5" fill="#334155" />
        <!-- Projector Body -->
        <rect x="5" y="14" width="20" height="11" rx="2" fill="#334155" stroke="#0F172A" stroke-width="1.2" />
        <!-- Glowing Projection Lens -->
        <polygon points="25,16 29,14 29,21 25,19" fill="#FBBF24" stroke="#0F172A" stroke-width="0.8" />
        <!-- Feet -->
        <line x1="8" y1="25" x2="8" y2="28" stroke="#0F172A" stroke-width="2" />
        <line x1="22" y1="25" x2="22" y2="28" stroke="#0F172A" stroke-width="2" />
      </g>
</svg>