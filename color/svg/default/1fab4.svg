<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="potted-plant">
<g stroke-linejoin="round">
        <!-- Plant stems -->
        <path d="M16 20 V9" stroke="#15803D" stroke-width="2" stroke-linecap="round" />
        <path d="M16 18 C14 15 11 13 9 12" stroke="#15803D" stroke-width="1.8" stroke-linecap="round" />
        <path d="M16 18 C18 15 21 13 23 12" stroke="#15803D" stroke-width="1.8" stroke-linecap="round" />
        <!-- Left heart/monstera leaf -->
        <path d="M9 7 C6 9.5 6 13.5 10 14 C12 12.5 12.5 9 9 7 Z" fill="#22C55E" stroke="#15803D" stroke-width="0.8" />
        <line x1="9" y1="7" x2="10" y2="14" stroke="#15803D" stroke-width="0.8" />
        <!-- Right heart/monstera leaf -->
        <path d="M23 7 C26 9.5 26 13.5 22 14 C20 12.5 19.5 9 23 7 Z" fill="#22C55E" stroke="#15803D" stroke-width="0.8" />
        <line x1="23" y1="7" x2="22" y2="14" stroke="#15803D" stroke-width="0.8" />
        <!-- Top center upright leaf -->
        <path d="M16 4 C13.5 7 13.5 11 16 13.5 C18.5 11 18.5 7 16 4 Z" fill="#4ADE80" stroke="#15803D" stroke-width="0.8" />
        <line x1="16" y1="4.5" x2="16" y2="13.5" stroke="#15803D" stroke-width="0.8" />
        <!-- Soil -->
        <ellipse cx="16" cy="19.5" rx="6.5" ry="1.5" fill="#451A03" />
        <!-- Terracotta Pot Brim -->
        <rect x="7.5" y="19" width="17" height="3" rx="1.2" fill="#EA580C" stroke="#9A3412" stroke-width="0.8" />
        <!-- Terracotta Pot Tapered Body -->
        <polygon points="9,22 10.5,28.5 21.5,28.5 23,22" fill="#C2410C" stroke="#9A3412" stroke-width="0.8" />
        <polygon points="9.5,22.5 10.5,28 14.5,28 14.5,22.5" fill="#EA580C" opacity="0.6" />
      </g>
</svg>