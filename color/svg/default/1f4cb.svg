<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="clipboard">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Brown wooden clipboard body -->
        <rect x="5" y="5" width="22" height="24" rx="2" fill="#D97706" stroke="#78350F" stroke-width="2" />
        <!-- White paper document sheet -->
        <rect x="8" y="8" width="16" height="18" rx="1" fill="#FFFFFF" stroke="#78350F" stroke-width="1.2" />
        <!-- Checklist items with green checkmarks -->
        <path d="M10 13 L11.5 14.5 L14.5 11.5" stroke="#16A34A" stroke-width="2" fill="none" />
        <line x1="16.5" y1="13.5" x2="21.5" y2="13.5" stroke="#94A3B8" stroke-width="1.2" />
        <path d="M10 18.5 L11.5 20 L14.5 17" stroke="#16A34A" stroke-width="2" fill="none" />
        <line x1="16.5" y1="19" x2="21.5" y2="19" stroke="#94A3B8" stroke-width="1.2" />
        <line x1="10.5" y1="23" x2="19" y2="23" stroke="#CBD5E1" stroke-width="1.2" />
        <!-- Metallic spring clip at top -->
        <rect x="10" y="2.5" width="12" height="5" rx="1.5" fill="#E2E8F0" stroke="#78350F" stroke-width="2" />
        <circle cx="16" cy="4.5" r="1.2" fill="#78350F" />
      </g>
</svg>