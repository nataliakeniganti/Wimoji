<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="film-frames">
<g>
        <!-- Dark Film Strip Body -->
        <rect x="3" y="8" width="26" height="16" rx="2" fill="#1E293B" stroke="#0F172A" stroke-width="1.2" />
        <!-- Sprocket Hole Perforations (Top Row) -->
        <rect x="5" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="9" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="13" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="17" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="21" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="25" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <!-- 2 Film Exposure Frame Windows -->
        <rect x="5.5" y="13.2" width="9.5" height="5.6" rx="0.6" fill="#38BDF8" fill-opacity="0.3" stroke="#475569" stroke-width="0.8" />
        <rect x="17" y="13.2" width="9.5" height="5.6" rx="0.6" fill="#38BDF8" fill-opacity="0.3" stroke="#475569" stroke-width="0.8" />
        <!-- Sprocket Hole Perforations (Bottom Row) -->
        <rect x="5" y="20" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="9" y="20" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="13" y="20" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="17" y="20" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="21" y="20" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
        <rect x="25" y="20" width="2.2" height="2.2" rx="0.4" fill="#F8FAFC" />
      </g>
</svg>