<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="face-with-thermometer">
<g>
        <ellipse cx="16" cy="16" rx="12.5" ry="12.5" fill="#FFCA28" stroke="#FFA000" stroke-width="0.8" />
        <ellipse cx="16" cy="15" rx="11" ry="11" opacity="0.3" fill="#FFE082" />
        <!-- Fever red blush cheeks -->
        <circle cx="8.5" cy="18" r="2.5" fill="#EF4444" opacity="0.4" />
        <circle cx="23.5" cy="18" r="2.5" fill="#EF4444" opacity="0.4" />
