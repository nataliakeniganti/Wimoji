<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="ring">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Gold ring band -->
        <circle cx="16" cy="19" r="8" fill="#F59E0B" stroke="#D97706" stroke-width="0.8" />
        <circle cx="16" cy="19" r="5.2" fill="#0F172A" />
