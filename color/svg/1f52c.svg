<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="microscope">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- C-shaped arm -->
        <path d="M21.4 25.6 C28.6 23.6 28.6 13.4 21 11.6" fill="none" stroke="#0F172A" stroke-width="5.64" /><path d="M21.4 25.6 C28.6 23.6 28.6 13.4 21 11.6" fill="none" stroke="#0284C7" stroke-width="3.4" />
        <!-- Base -->
        <rect x="5.4" y="25.6" width="21.6" height="3.4" rx="1.6" fill="#1E293B" stroke="#0F172A" stroke-width="1.4" />
        <!-- Specimen stage joined to the arm -->
        <rect x="8.2" y="20.2" width="15" height="2.4" rx="1" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.4" />
        <path d="M11 19.6 H17" stroke="#7DD3FC" stroke-width="1.3" fill="none" />
        <!-- Illumination mirror -->
        <ellipse cx="11" cy="24.4" rx="2.6" ry="1.1" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.1199999999999999" />
        <!-- Angled body tube, objective and eyepiece -->
        <g transform="rotate(22 16 14)" stroke="#0F172A" stroke-width="1.4">
          <rect x="14.4" y="15" width="3.2" height="3.6" rx="0.8" fill="#CBD5E1" />
          <rect x="13.4" y="5" width="5.2" height="10.4" rx="1.2" fill="#0284C7" />
          <rect x="14.2" y="1.6" width="3.6" height="3.8" rx="1" fill="#CBD5E1" />
          <path d="M13.8 9 H18.2" fill="none" stroke="#0F172A" stroke-width="0.9799999999999999" opacity="0.7" />
        </g>
        <!-- Focus knob -->
        <circle cx="24.6" cy="17.6" r="2.1" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.4" />
        <circle cx="24.6" cy="17.6" r="0.6" fill="#0F172A" stroke="none" />
      </g>
</svg>