<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="derelict-house">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Weathered Grey Wall -->
        <rect x="5" y="13.5" width="22" height="13.5" fill="#64748B" stroke="#1E293B" stroke-width="1.2" />
        <!-- Broken Boarded Up Window -->
        <rect x="8" y="16" width="5.5" height="5" fill="#1E293B" />
        <line x1="7.5" y1="17.5" x2="14" y2="20" stroke="#78350F" stroke-width="1.2" />
        <line x1="7.5" y1="20" x2="14" y2="17.5" stroke="#78350F" stroke-width="1.2" />
        <!-- Crooked Leaning Open Doorway -->
        <polygon points="17.5,20 22.5,19 22.5,27 17.5,27" fill="#1E293B" stroke="#0F172A" stroke-width="1" />
        <!-- Sagged Weathered Roof with Missing Shingles -->
        <polygon points="16,5 3,14 29,14" fill="#78350F" stroke="#451A03" stroke-width="1.2" />
        <polygon points="16,5 11,10 16,9 21,10" fill="#451A03" opacity="0.4" />
      </g>
</svg>