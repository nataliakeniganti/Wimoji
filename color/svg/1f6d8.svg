<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="landslide">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Mountain Cliff Slope &amp; Exposed Earth -->
        <polygon points="3,28 4,16 7,9 10,6 13,8 14,14 16,21 21,28" fill="#64748B" stroke="#1E293B" stroke-width="1" />
        <polygon points="10,6 13,8 20,16 28,26 28,28 17,28 12,19" fill="#854D0E" stroke="#1E293B" stroke-width="1" />
        <!-- Ridge Vegetation -->
        <polygon points="4,16 7,9 10,6 12,7 9,13 4,17" fill="#15803D" />
        <!-- Craggy Fracture Lines -->
        <line x1="7" y1="12" x2="10" y2="18" stroke="#1E293B" stroke-width="0.8" />
        <line x1="10" y1="18" x2="8" y2="23" stroke="#1E293B" stroke-width="0.8" />
        <line x1="12" y1="14" x2="15" y2="20" stroke="#1E293B" stroke-width="0.8" />
        <!-- Tumbling Boulders &amp; Rocks -->
        <polygon points="19,11 23,10.5 24.5,13.5 22.5,16 18.5,14" fill="#64748B" stroke="#1E293B" stroke-width="0.9" />
        <polygon points="23,17 26.5,16.5 28,19.5 26,22.5 22,21" fill="#64748B" stroke="#1E293B" stroke-width="0.9" />
        <polygon points="16.5,23 19.5,22 20.5,25 18,26.5" fill="#64748B" stroke="#1E293B" stroke-width="0.8" />
        <!-- Debris Stones -->
        <polygon points="15,9.5 17,9 17.5,11 15.5,11.5" fill="#334155" />
        <circle cx="27" cy="14" r="1.1" fill="#334155" />
        <circle cx="21" cy="20" r="1.2" fill="#334155" />
        <circle cx="26" cy="25" r="1.2" fill="#334155" />
        <!-- Dust Motion Streaks -->
        <line x1="16" y1="8" x2="18" y2="10" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="1 1" />
        <line x1="22" y1="8.5" x2="25" y2="11.5" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="1 1" />
        <line x1="13" y1="16" x2="15" y2="18.5" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="1 1" />
        <!-- Ground Baseline -->
        <line x1="2" y1="28" x2="30" y2="28" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />
      </g>
</svg>