        <!-- Cheering spark sound accents -->
        <line x1="25" y1="8" x2="28" y2="6" stroke="#F59E0B" stroke-width="1.9" />
        <line x1="26" y1="15" x2="29.5" y2="15" stroke="#F59E0B" stroke-width="1.9" />
        <line x1="25" y1="22" x2="28" y2="24" stroke="#F59E0B" stroke-width="1.9" />
      </g>
</svg>