<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="ballot-box-with-ballot">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Blue Secure Voting Box -->
        <rect x="4" y="11" width="24" height="17" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.2" />
        <!-- Top Slot Recess -->
        <rect x="7" y="10" width="18" height="2" rx="0.5" fill="#0F172A" />
        <!-- Paper Ballot Cast into Slot -->
        <polygon points="10,4 22,4 22,13 10,13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
        <!-- Green Checkmark on Ballot Paper -->
        <path d="M13 8.5l2 2 4-4" fill="none" stroke="#16A34A" stroke-width="1.8" />
      </g>
</svg>