<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="robot">
<g stroke="#334155" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
        <!-- Top antenna -->
        <line x1="16" y1="3" x2="16" y2="7" stroke-width="1.4" />
        <circle cx="16" cy="3" r="1.8" fill="#EF4444" stroke="#B91C1C" />
        <!-- Bolt ears on sides -->
        <rect x="3.5" y="12" width="3" height="8" rx="1" fill="#64748B" />
        <rect x="25.5" y="12" width="3" height="8" rx="1" fill="#64748B" />
