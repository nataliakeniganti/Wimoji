        <path d="M16.6 16 V18.9 M19.6 16 V18.9" stroke="#CBD5E1" stroke-width="0.8" />
        <!-- Plump rounded lower lip indented by bite -->
        <path d="M4 16 C8 23.5 12 25 16 25 C20 25 24 23.5 28 16 C23.5 18 21.5 19.6 18.8 19.6 C16 19.6 14 17.5 4 16 Z" fill="#EF4444" stroke="#991B1B" stroke-width="1.8" />
