<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="cityscape">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Dusk/Evening Sky Background -->
        <rect x="2" y="2" width="28" height="26" rx="2" fill="#0F172A" />
        <!-- Antenna Spire with Warning Beacon -->
        <line x1="16" y1="6" x2="16" y2="2.5" stroke="#94A3B8" stroke-width="1.2" />
        <circle cx="16" cy="2.5" r="0.8" fill="#EF4444" />
        <!-- Center Tallest Tower -->
        <rect x="13" y="6" width="6" height="22" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
        <circle cx="16" cy="9" r="0.8" fill="#FEF08A" />
        <circle cx="16" cy="13" r="0.8" fill="#FEF08A" />
        <circle cx="16" cy="17" r="0.8" fill="#FEF08A" />
        <circle cx="16" cy="21" r="0.8" fill="#FEF08A" />
        <!-- Left Tower -->
        <rect x="7" y="10" width="6" height="18" fill="#334155" stroke="#475569" stroke-width="0.8" />
        <rect x="8.5" y="12" width="3" height="1.5" fill="#FEF08A" />
        <rect x="8.5" y="16" width="3" height="1.5" fill="#FEF08A" />
        <rect x="8.5" y="20" width="3" height="1.5" fill="#FEF08A" />
        <!-- Right Modern Tower -->
        <rect x="19" y="13" width="6" height="15" fill="#1E3A8A" stroke="#2563EB" stroke-width="0.8" />
        <rect x="20.5" y="15" width="3" height="1.5" fill="#FEF08A" />
        <rect x="20.5" y="19" width="3" height="1.5" fill="#FEF08A" />
        <!-- Outer Flanking Low-Rises -->
        <rect x="2" y="16" width="5" height="12" fill="#1E293B" />
        <rect x="25" y="18" width="5" height="10" fill="#1E293B" />
      </g>
</svg>