<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="open-mailbox-with-raised-flag">
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.4 -0.7)">
    <!-- Post -->
    <rect x="11" y="25" width="6" height="5" fill="#A8A29E" />
    <!-- Flag -->
    <path d="M26.5 17 V4" stroke="#78716C" stroke-width="2" fill="none" />
    <rect x="26.5" y="3.5" width="4" height="4.5" rx="0.6" fill="#EF4444" />
    <!-- Arched mailbox body and base -->
    <path d="M4 22 V14 C4 8.5 8.5 5.5 14 5.5 C19.5 5.5 24 8.5 24 14 V22 Z" fill="#3B82F6" />
    <rect x="2.5" y="21.5" width="23" height="3.5" rx="1.2" fill="#1E3A8A" />
    <!-- Open doorway -->
    <path d="M7.5 22 V14.5 C7.5 11.5 10.5 9 14 9 C17.5 9 20.5 11.5 20.5 14.5 V22 Z" fill="#1E3A8A" />
    <!-- Letters poking out -->
    <rect x="9.5" y="13" width="7" height="5.5" rx="0.8" fill="#FFFFFF" transform="rotate(-8 13 15.75)" />
    <rect x="11.5" y="14.5" width="7" height="5.5" rx="0.8" fill="#E2E8F0" />
    <path d="M11.5 15.2 L15 17.6 L18.5 15.2" stroke="#94A3B8" stroke-width="0.9" fill="none" />
  </g>
</svg>