        <!-- Bomb cylinder neck -->
        <rect x="18" y="7" width="4" height="3" rx="0.8" transform="rotate(-35 20 8.5)" fill="#475569" stroke="#0F172A" stroke-width="0.8" />
        <!-- Round cannonball bomb body -->
