          <path d="M8.5 9.5 L13.5 9.5 L12.8 13.8 C12.3 15.8 9.7 15.8 9.2 13.8 Z" fill="#FBBF24" />
          <!-- Sparkling Bubbles -->
          <circle cx="10.5" cy="11.5" r="0.5" fill="#FFFFFF" />
          <circle cx="11.8" cy="13" r="0.5" fill="#FFFFFF" />
        </g>
        <!-- Right Champagne Flute -->
        <g transform="rotate(-14 21 18)">
          <!-- Stem and Foot -->
          <line x1="21" y1="16" x2="21" y2="25" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" />
          <ellipse cx="21" cy="25" rx="3.5" ry="1" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8" />
          <!-- Glass Bowl -->
          <path d="M18 6 L24 6 L23 14 C22.5 16.5 19.5 16.5 19 14 Z" fill="#F0F9FF" fill-opacity="0.45" stroke="#94A3B8" stroke-width="1" />
          <!-- Golden Champagne Liquid -->
          <path d="M18.5 9.5 L23.5 9.5 L22.8 13.8 C22.3 15.8 19.7 15.8 19.2 13.8 Z" fill="#FBBF24" />
          <!-- Sparkling Bubbles -->
          <circle cx="20.5" cy="11.5" r="0.5" fill="#FFFFFF" />
          <circle cx="21.8" cy="13" r="0.5" fill="#FFFFFF" />
