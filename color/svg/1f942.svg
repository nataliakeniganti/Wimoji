        <!-- Left Champagne Flute -->
        <g transform="rotate(14 11 18)">
          <!-- Stem and Foot -->
          <line x1="11" y1="16" x2="11" y2="25" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" />
          <ellipse cx="11" cy="25" rx="3.5" ry="1" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8" />
