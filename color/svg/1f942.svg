<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="clinking-glasses">
<g>
        <!-- Center Clink Celebration Sparkle Star -->
        <path d="M16 2 L16.8 4.2 L19 5 L16.8 5.8 L16 8 L15.2 5.8 L13 5 L15.2 4.2 Z" fill="#F59E0B" />
