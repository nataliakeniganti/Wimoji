<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="compass">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Top brass suspension ring -->
        <circle cx="16" cy="5.2" r="2.2" fill="none" stroke="#78350F" stroke-width="2" />
        <circle cx="16" cy="5.2" r="2.2" fill="none" stroke="#F59E0B" stroke-width="1.1" />
        <!-- Outer brass casing -->
        <circle cx="16" cy="17.6" r="10.4" fill="#F59E0B" stroke="#78350F" stroke-width="1.2" />
        <!-- Crisp white compass dial -->
        <circle cx="16" cy="17.6" r="7.8" fill="#F8FAFC" stroke="#78350F" stroke-width="1" />
        <!-- Cardinal tick marks -->
        <path d="M16 10.6 V12 M16 23.2 V24.6 M9 17.6 H10.4 M21.6 17.6 H23" stroke="#64748B" stroke-width="1.2" />
        <!-- South silver half of needle -->
        <path d="M14.3 15.9 L12 21.6 L17.7 19.3 Z" fill="#94A3B8" stroke="#78350F" stroke-width="0.9" />
        <!-- North red half of needle -->
        <path d="M20 13.6 L14.3 15.9 L17.7 19.3 Z" fill="#EF4444" stroke="#78350F" stroke-width="0.9" />
        <!-- Center pivot pin -->
        <circle cx="16" cy="17.6" r="1.2" fill="#F59E0B" stroke="#78350F" stroke-width="0.8" />
      </g>
</svg>