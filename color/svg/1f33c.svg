<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="blossom">
<g>
        <!-- 8 radiating rounded petals -->
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(0 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(45 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(90 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(135 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(180 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(225 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(270 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
          <circle cx="16" cy="8.5" r="4" transform="rotate(315 16 16)" fill="#FEF08A" stroke="#FBBF24" stroke-width="0.8" />
        
        <!-- Golden Center -->
        <circle cx="16" cy="16" r="4.5" fill="#F59E0B" stroke="#D97706" stroke-width="1" />
        <circle cx="14.8" cy="14.8" r="1.2" fill="#FFFFFF" opacity="0.6" />
