<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="person-in-suit-levitating-light">
<g stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Floating shadow on floor beneath levitating feet -->
        <ellipse cx="16" cy="29" rx="6.5" ry="1.5" fill="#64748B" stroke="none" opacity="0.45" />
        <!-- Black fedora hat -->
        <path d="M10 6.5 H22" stroke-width="2.4" />
        <path d="M12 6.5 V3 C12 2.5 13.5 2 16 2 C18.5 2 20 2.5 20 3 V6.5 Z" fill="#1E293B" />
        <!-- Face with dark sunglasses -->
        <circle cx="16" cy="7.8" r="2.2" fill="#F7DECE" stroke-width="1.4" />
        <rect x="14" y="7.2" width="4" height="1.2" rx="0.5" fill="#0F172A" stroke="none" />
        <!-- Suit jacket &amp; white shirt with tie -->
        <path d="M11.5 10 H20.5 L21.5 17 H10.5 Z" fill="#1E293B" />
        <polygon points="14.5,10 16,14 17.5,10" fill="#F8FAFC" stroke="none" />
        <line x1="16" y1="11" x2="16" y2="15.5" stroke="#0F172A" stroke-width="1.4" />
        <!-- Levitating arms slightly out at sides -->
        <path d="M11 10 L8 14 L8.5 16.5" fill="none" />
        <path d="M21 10 L24 14 L23.5 16.5" fill="none" />
        <!-- Levitating legs with feet pointed down -->
        <path d="M13 17 L12.5 24 L14 26" fill="none" />
        <path d="M19 17 L19.5 24 L18 26" fill="none" />
      </g>
</svg>