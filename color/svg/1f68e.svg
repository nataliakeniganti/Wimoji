        <rect x="13.5" y="11" width="5" height="5" rx="1" fill="#38BDF8" />
        <rect x="21" y="11" width="5" height="5" rx="1" fill="#38BDF8" />
        <!-- Rubber Tires -->
        <circle cx="8" cy="24" r="2.8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
        <circle cx="24" cy="24" r="2.8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
