<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="telescope">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Tripod Legs -->
        <g stroke="#0F172A" stroke-width="2">
          <line x1="14" y1="18" x2="6" y2="29" />
          <line x1="14" y1="18" x2="14" y2="29" />
          <line x1="14" y1="18" x2="22" y2="29" />
        </g>
        <!-- Leg Spread Bracket &amp; Mount Head -->
        <line x1="9" y1="24.5" x2="19" y2="24.5" stroke="#64748B" stroke-width="1.2" />
        <circle cx="14" cy="18" r="2.2" fill="#64748B" stroke="#0F172A" stroke-width="1" />
        <!-- Diagonal Main Barrel Assembly -->
        <g transform="rotate(-32 14 14)">
          <!-- Eyepiece Tube -->
          <rect x="3.5" y="12.5" width="4" height="3" rx="0.6" fill="#94A3B8" stroke="#0F172A" stroke-width="1" />
          <!-- Main Body Tube -->
          <rect x="7" y="11.5" width="18" height="5" rx="1" fill="#334155" stroke="#0F172A" stroke-width="1.2" />
          <!-- Decorative Stripe -->
          <rect x="11" y="11.5" width="3" height="5" fill="#EF4444" />
          <!-- Objective Lens Hood &amp; Lens Glass -->
          <rect x="25" y="10.5" width="3" height="7" rx="0.8" fill="#64748B" stroke="#0F172A" stroke-width="1.2" />
          <ellipse cx="28" cy="14" rx="0.6" ry="3" fill="#38BDF8" />
          <!-- Finder Scope On Top -->
          <rect x="14" y="8.5" width="7" height="2" rx="0.5" fill="#475569" stroke="#0F172A" stroke-width="0.8" />
          <line x1="16" y1="10.5" x2="16" y2="11.5" stroke="#0F172A" stroke-width="1" />
          <line x1="19" y1="10.5" x2="19" y2="11.5" stroke="#0F172A" stroke-width="1" />
        </g>
      </g>
</svg>