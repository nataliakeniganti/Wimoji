<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="takeout-box">
<g>
        <!-- Wire Carry Handle Behind Flaps -->
        <path d="M9 16 C9 7.5 23 7.5 23 16" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" fill="none" />
        <!-- Tapered Oyster Pail Carton Body -->
        <polygon points="7,12 25,12 22,27 10,27" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round" />
        <!-- Angled Fold Flaps -->
        <polygon points="7,12 11,8 21,8 25,12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round" />
        <!-- Red Chinese Pagoda Takeout Emblem -->
        <g stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" fill="none">
          <line x1="15" y1="16.5" x2="17" y2="16.5" />
          <line x1="13.5" y1="19" x2="18.5" y2="19" />
          <line x1="12.5" y1="21.5" x2="19.5" y2="21.5" />
        </g>
        <!-- Wire Handle Rivets on Sides -->
        <circle cx="8.5" cy="16" r="0.8" fill="#64748B" />
        <circle cx="23.5" cy="16" r="0.8" fill="#64748B" />
      </g>
</svg>