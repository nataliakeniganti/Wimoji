<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="joystick">
<g stroke-linecap="round" stroke-linejoin="round">
        <!-- Arcade Control Base -->
        <rect x="5" y="20" width="22" height="8" rx="2.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.2" />
        <!-- Button 1 &amp; 2 on Base -->
        <circle cx="20" cy="24" r="1.8" fill="#FBBF24" />
        <circle cx="24" cy="24" r="1.8" fill="#22C55E" />
        <!-- Metal Shaft Stick -->
        <line x1="11.5" y1="20" x2="13.5" y2="8" stroke="#CBD5E1" stroke-width="3" />
        <!-- Red Ball Top Knob -->
        <circle cx="13.5" cy="7" r="4" fill="#EF4444" stroke="#991B1B" stroke-width="1" />
        <circle cx="12" cy="5.5" r="1.2" fill="#FFFFFF" opacity="0.6" />
      </g>
</svg>