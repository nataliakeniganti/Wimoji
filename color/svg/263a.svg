        <!-- Google Noto Style Warm Base Circle with Rim -->
        <circle cx="16" cy="16" r="12.5" fill="#FFCA28" stroke="#FFA000" stroke-width="0.8" />
        <circle cx="16" cy="15" r="11" fill="#FFE082" opacity="0.35" />
