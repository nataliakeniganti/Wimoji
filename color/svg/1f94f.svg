<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="flying-disc">
<g transform="rotate(-15 16 16)">
        <!-- Flying Disc Plastic Mold Body -->
        <ellipse cx="16" cy="16" rx="12.5" ry="6.5" fill="#0284C7" stroke="#0369A1" stroke-width="1.2" />
        <!-- Raised Outer Rim Lip -->
        <ellipse cx="16" cy="16" rx="11" ry="5.5" fill="none" stroke="#0369A1" stroke-width="0.8" opacity="0.6" />
        <!-- Aerodynamic Flight Rings (Grip Grooves) -->
