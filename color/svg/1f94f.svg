        <ellipse cx="16" cy="16" rx="5" ry="2.2" fill="none" stroke="#38BDF8" stroke-width="1" />
        <!-- Center Crown Dome -->
        <circle cx="16" cy="16" r="1.5" fill="#38BDF8" opacity="0.8" />
        <!-- Glint Highlight -->
        <path d="M7 14 C10 11 18 11 23 13" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5" />
