<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" data-vendor="wimoji" data-id="christmas-tree">
<g>
        <!-- Brown Trunk -->
        <rect x="14" y="25" width="4" height="5" fill="#78350F" />
        <!-- Bottom Tier -->
        <polygon points="16,17 26.5,26 5.5,26" fill="#16A34A" stroke="#14532D" stroke-width="0.8" />
        <!-- Middle Tier -->
        <polygon points="16,12 24,20 8,20" fill="#16A34A" stroke="#14532D" stroke-width="0.8" />
        <!-- Top Tier -->
        <polygon points="16,7 21,14 11,14" fill="#16A34A" stroke="#14532D" stroke-width="0.8" />
        <!-- Colorful Baubles / Ornaments -->
        <circle cx="10" cy="24" r="1.5" fill="#EF4444" />
        <circle cx="22" cy="24" r="1.5" fill="#FBBF24" />
        <circle cx="16" cy="23" r="1.5" fill="#38BDF8" />
        <circle cx="13" cy="18" r="1.3" fill="#FBBF24" />
        <circle cx="19" cy="18" r="1.3" fill="#EF4444" />
        <circle cx="16" cy="13" r="1.2" fill="#E11D48" />
        <!-- Gold Star on Top -->
        <polygon points="16,2.5 17.2,5.5 20.5,5.5 17.8,7.5 18.8,10.5 16,8.8 13.2,10.5 14.2,7.5 11.5,5.5 14.8,5.5" fill="#FBBF24" stroke="#D97706" stroke-width="0.6" />
      </g>
</svg>